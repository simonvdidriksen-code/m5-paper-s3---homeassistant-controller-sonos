# M5Paper S3 – e-ink control panel for Home Assistant
# 540x960 portrait (USB-C at the bottom). Two pages, switched from the bottom bar:
#   Areas – up to 12 rooms, each set up in HA ("Area 1 name" ... "Area 12
#           sensors": name, icon, up to 6 lights, up to 4 scenes, temperature /
#           humidity / CO2). Tap a room's row to toggle its lights; hold it
#           ("Area menu hold time" in HA) for that room's lights one by one,
#           with brightness, and its scenes. What isn't set isn't shown.
#   Sonos – tick rooms, play/pause speakers, playlists + radio, volume, group all zones
#
# Low power: after "Sleep after" seconds (set in Home Assistant) without touch
# or movement, or at once with the "Sleep now" button in HA, the screen gets a
# clean refresh, Wi-Fi turns off and the chip
# light-sleeps. A tap or picking the device up wakes it (the waking tap also
# acts unless "Waking tap acts" is off); how easily movement wakes it is
# "Motion sensitivity" in HA. Never sleeps on USB power.
# "Stay connected after sleep" (minutes, 0 = off) keeps Wi-Fi and HA connected
# that long after the screen has gone to sleep, so a tap or pick-up in that
# time acts at once instead of waiting for Wi-Fi (costs battery meanwhile).
#
# Power off ("Power off" in HA, a hold or tap on the battery at the top right,
# or by itself when the battery is empty) leaves a "Slukket" screen on the e-ink.
#
# Every setting in HA is stored on the device and survives power off; nothing
# is read back from HA at boot.
#
# Responsiveness: every touch clicks the buzzer (switch "Touch sound" in HA),
# taps change the screen at once and are sent to Home Assistant right away, or
# queued and sent as soon as it is connected after boot or wake (queued light
# and speaker taps toggle from HA's real state, as the screen may be out of
# date then). The screen is
# pure black and white, so every refresh (taps, page switches, updates) uses the
# fast black/white mode; a full flash (only where the picture changed) follows
# after enough of them once the panel has been left alone for a bit. Sensor and
# state updates are batched into one background refresh. LVGL draws straight
# into the e-ink driver's buffer, and the panel is only driven when a pixel
# actually changed ("Screen refresh time" in HA shows how long a refresh takes).
#
# Wi-Fi after waking: fixed IP (no DHCP), the saved access point and channel
# (no scan), and no Wi-Fi power saving until HA is connected and settled. HA
# is told before the panel sleeps, so it reconnects as soon as the panel is back
# ("Wake to Wi-Fi" and "Wake to HA ready" in HA show how long that takes).
#
# After adopting the device in Home Assistant:
#   Settings > Devices & services > ESPHome > M5Paper Areas > Configure
#   > enable "Allow the device to perform Home Assistant actions"
# Without that, taps do nothing.

substitutions:
  name: m5paper-areas
  friendly_name: M5Paper Areas

  # Fixed network address: skips DHCP on every wake. Values from your network
  # (router, subnet mask). Reserve this address for the device's MAC address
  # in the router so it never hands it to anything else.
  static_ip: 192.172.168.67
  gateway: 192.168.1.1
  subnet: 255.248.0.0
  dns: 192.168.1.1

  # Touch click: tone and length (loudness is "Touch sound volume" in HA)
  beep_hz: "4000"
  beep_ms: "30"

  # ---- Sonos favorites on the playlist buttons: typed in HA ("Playlist
  # button 1" to "4"), matched to sensor.sonos_favorites by name

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  build_flags:
    - "-DBOARD_HAS_PSRAM"
  includes:
    - <esp_sleep.h>
    - <esp_wifi.h>
    - <driver/gpio.h>
  libraries:
    - EPDIY=https://github.com/patrick3399/epdiy
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Motion sensor: accelerometer only, power-optimised 12.5 Hz (~15 uA).
          // Gyro and temperature stay off; we only need it to notice movement.
          auto wr = [](uint8_t reg, uint8_t val) {
            const uint8_t b[2] = {reg, val};
            id(bus_internal)->write(0x68, b, 2);
            delay(2);
          };
          wr(0x7D, 0x04);  // PWR_CTRL: accelerometer only
          wr(0x41, 0x00);  // ACC_RANGE: +-2 g (16384 LSB/g)
          wr(0x40, 0x25);  // ACC_CONF: 12.5 Hz, low-power, 4-sample average
          wr(0x7C, 0x01);  // PWR_CONF: advanced power save

          // LVGL draws straight into the e-ink driver's (epdiy's) buffer, two
          // pixels per byte, instead of one call per pixel into ESPHome's
          // display buffer and another per pixel when the driver copies that
          // whole buffer before every refresh. Every pixel is snapped to pure
          // black or white (font and rounded-corner edges too; RGB565, grey
          // >= 50 % -> white) so the fast black/white refresh draws it cleanly.
          // LVGL works in portrait (540 x 960, "rotation: 270" below); the panel
          // is 960 x 540, and portrait (x, y) is panel (y, 539 - x), the same
          // as ESPHome's own rotation (change both together).
          lv_display_set_flush_cb(lv_display_get_default(), [](lv_display_t *disp, const lv_area_t *a, uint8_t *px_map) {
            struct Ink : ed047tc1::ED047TC1Display {
              static EpdiyHighlevelState *state(ed047tc1::ED047TC1Display *d) { return &static_cast<Ink *>(d)->hl_state_; }
            };
            EpdiyHighlevelState *hl = Ink::state(id(epaper));
            uint8_t *fb = hl->front_fb;          // what the panel should show
            const uint8_t *shown = hl->back_fb;  // what it shows now
            const uint16_t *src = (const uint16_t *) px_map;
            const int w = lv_area_get_width(a);
            // Panel columns this area covers (portrait rows), within the panel
            const int c0 = std::max<int>(a->y1, 0), c1 = std::min<int>(a->y2, 959);
            bool changed = false;
            for (int lx = 0; lx < w && c0 <= c1; lx++) {
              const int py = 539 - (a->x1 + lx);  // panel row
              if (py < 0 || py > 539) continue;
              uint8_t *row = fb + py * 480;
              const uint8_t *was = shown + py * 480;
              const uint16_t *s = src + (c0 - a->y1) * w + lx;  // down the portrait column
              int c = c0;
              if (c & 1) {  // odd first column: high nibble only
                uint8_t &b = row[c >> 1];
                b = (b & 0x0F) | ((*s & 0x0400) ? 0xF0 : 0x00);
                changed |= b != was[c >> 1];
                s += w;
                c++;
              }
              for (; c < c1; c += 2, s += 2 * w) {  // two pixels per byte
                const uint8_t b = ((s[0] & 0x0400) ? 0x0F : 0x00) | ((s[w] & 0x0400) ? 0xF0 : 0x00);
                row[c >> 1] = b;
                changed |= b != was[c >> 1];
              }
              if (c == c1) {  // odd last column: low nibble only
                uint8_t &b = row[c >> 1];
                b = (b & 0xF0) | ((*s & 0x0400) ? 0x0F : 0x00);
                changed |= b != was[c >> 1];
              }
            }
            // Panel rows drawn into since the last refresh (only those get compared)
            const int r0 = std::max<int>(0, 539 - a->x2), r1 = std::min<int>(539, 539 - a->x1);
            if (r0 <= r1) {
              id(ink_y0) = std::min(id(ink_y0), r0);
              id(ink_y1) = std::max(id(ink_y1), r1);
            }
            if (changed) id(ink_dirty) = true;
            lv_display_flush_ready(disp);
          });
          lv_obj_invalidate(lv_screen_active());
          lv_obj_invalidate(lv_layer_top());
          // Power-off hold time from HA
          if (!std::isnan(id(power_hold_s).state))
            lv_indev_set_long_press_time(lv_indev_get_next(nullptr), (uint32_t) (id(power_hold_s).state * 1000));
          // Show the stored sleep time in HA right away
          id(sleep_after).publish_state(id(sleep_s));
          id(motion_scale).execute();
          id(pl_labels).execute();
          // Areas from their settings (stored on the panel), before the first
          // screen and before HA connects (it subscribes to their entities then).
          // Their arrays start zeroed (see globals): "unknown" is NAN, "none" -1.
          id(cfg_val).fill(NAN);
          id(l_ha_bri).fill(NAN);
          id(light_bri).fill(NAN);
          id(bri_queue).fill(-1);
          id(cfg_apply).execute();

          // First screen: the display driver has just cleared the panel to
          // white (full flash + clear cycles), so the fast black/white refresh
          // draws it cleanly; a second full flash would only cost time, and
          // e-ink refreshes hold up Wi-Fi while it connects.
          id(last_activity) = millis();
          id(ink_want) |= 1;
          id(ink_fast).execute();

external_components:
  - source: github://patrick3399/esphome_components
    components: [ed047tc1]
    refresh: 1d

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    version: latest
    advanced:
      # Faster drawing: optimise for speed (-O2) instead of size (-Os)
      compiler_optimization: PERF
      # Main loop stack (default 8 KB). It sits right above FreeRTOS's own
      # variables, so running past its end corrupts them and the panel
      # crashes a moment later.
      loop_task_stack_size: 16384
    sdkconfig_options:
      CONFIG_EPD_OUTPUT_LUT_ASSEMBLY: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "16384"
      # Faster boot: skip the PSRAM self-test (writes and reads all 8 MB)
      CONFIG_SPIRAM_MEMTEST: "n"

psram:
  mode: octal
  speed: 80MHz

# Settings live on the device and are written to flash within a second of a
# change (the default is once a minute, too slow before a power off)
preferences:
  flash_write_interval: 1s

logger:
  level: INFO
  baud_rate: 0
  logs:
    # each light-sleep cycle blocks the loop for ~1 s on purpose; don't warn about it
    component: ERROR
    # the display driver logs two lines on every refresh
    ed047tc1: WARN

api:
  # Home Assistant asks for this key when it (re)connects. Keep it fixed.
  # It lives in ESPHome's secrets (secrets.yaml, see secrets.example.yaml).
  encryption:
    key: !secret api_encryption_key
  # The panel sleeps with Wi-Fi off, so never reboot just because HA is away
  reboot_timeout: 0s
  # Send state and entity messages almost at once (default 100 ms batching),
  # so HA's (re)connect after waking finishes sooner
  batch_delay: 10ms
  # The panel connects to HA itself as soon as Wi-Fi is up after a wake or
  # boot (HA 2026.10+ accepts these "dial-back" connections and is
  # remembered as the target the first time it connects), instead of waiting
  # for HA's retry schedule or mDNS. HA only takes it once it knows the old
  # connection is gone, i.e. after a sleep or "Power off", not after a reset.
  outgoing_connection:
    delay: 1s
  on_client_connected:
    - if:
        condition:
          lambda: 'return client_info.find("Home Assistant") != std::string::npos;'
        then:
          - lambda: |-
              id(api_ready) = true;
              id(ha_heard) = false;
              lv_label_set_text(id(conn_icon), "");
          # HA takes actions only once it has subscribed to them, which it does
          # just before it sends its states: wait for those (3 s at most), or
          # taps made while connecting get dropped. (Its client asks for actions
          # and states in one batch, actions first, so a short margin will do.)
          - wait_until:
              condition:
                lambda: "return id(ha_heard) || !id(api_ready);"
              timeout: 3s
          - delay: 50ms
          - if:
              condition:
                lambda: "return id(api_ready);"
              then:
                # Send the taps made while connecting, then redraw from the fresh
                # states in one background refresh; from here on taps set what
                # the screen shows
                - lambda: |-
                    id(states_fresh) = true;
                    // Timing: from waking (or boot) until taps reach HA
                    if (id(wake_timing)) {
                      id(wake_timing) = false;
                      id(t_wake_ha).publish_state((millis() - id(wake_at)) / 1000.0f);
                    }
                - script.execute: flush_queue
                - script.execute: refresh_lights
                - script.execute: refresh_sonos
                - script.execute: refresh_subs
                - script.execute: update_battery
                - script.execute: wifi_settle
                # Woke only to refresh the screen: go back to sleep once it's updated
                - if:
                    condition:
                      lambda: "return id(refresh_wake);"
                    then:
                      - delay: 10s
                      - if:
                          condition:
                            lambda: "return id(refresh_wake);"
                          then:
                            - script.execute: { id: go_sleep, full: false, forced: false }
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return client_info.find("Home Assistant") != std::string::npos;'
        then:
          - lambda: |-
              id(api_ready) = false;
              id(states_fresh) = false;
              // (not while going to sleep: that disconnect is ours, and the
              // screen should keep saying "Sover"; nor for the quick reconnect
              // after new area settings)
              const bool quiet = id(quiet_until) != 0 && (int32_t) (id(quiet_until) - millis()) > 0;
              if (!id(sleeping) && !id(go_sleep).is_running() && !id(radio_off).is_running() && !quiet) {
                lv_label_set_text(id(conn_icon), "\U000F16C7");
                id(ink_want) |= 1;
                id(ink_fast).execute();
              }

ota:
  - platform: esphome

# A new install counts as working once it has run 20 s (default 1 min) or is
# powered off from the panel / HA. A power cut before that (or a crash) makes
# the next boot roll back to the previous firmware.
safe_mode:
  boot_is_good_after: 20s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Reconnect straight to the saved access point and channel after waking (no scan)
  fast_connect: true
  # No DHCP round trips after waking
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway}
    subnet: ${subnet}
    dns1: ${dns}
  # Full-speed radio while (re)connecting: the many small HA handshake replies
  # aren't held back until the next beacon. wifi_settle turns power saving on
  # once HA is connected (on battery only).
  power_save_mode: none
  reboot_timeout: 0s
  on_connect:
    - lambda: |-
        // Timing: from waking (or boot) until Wi-Fi is up
        if (id(wifi_timing)) {
          id(wifi_timing) = false;
          id(t_wake_wifi).publish_state((millis() - id(wake_at)) / 1000.0f);
        }
  ap:
    ssid: "M5Paper-Areas Fallback"

captive_portal:

# ---------------------------------------------------------------- settings in HA

number:
  # Seconds without touch or movement before it sleeps. Kept in the global
  # sleep_s (the old minutes value stored for this entity isn't reused).
  - platform: template
    id: sleep_after
    name: "Sleep after"
    icon: mdi:sleep
    unit_of_measurement: s
    min_value: 1
    max_value: 600
    step: 1
    mode: box
    entity_category: config
    lambda: "return id(sleep_s);"
    set_action:
      - lambda: |-
          id(sleep_s) = x;
          id(sleep_after).publish_state(x);
  - platform: template
    id: refresh_minutes
    name: "Refresh while asleep"
    icon: mdi:timer-refresh-outline
    unit_of_measurement: min
    min_value: 0              # 0 = never
    max_value: 720
    step: 5
    initial_value: 60
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  # How easily picking up / moving the panel wakes it (and keeps it awake).
  # 0 = off; 1 to 100 runs evenly from "Motion sensitivity min" to "max".
  - platform: template
    id: motion_level
    name: "Motion sensitivity"
    icon: mdi:cellphone-arrow-down
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    mode: slider
    entity_category: config
    on_value:
      - script.execute: motion_scale
  # The ends of that scale, as strengths: 1 = a firm move (~0.5 g), 10 =
  # ~0.05 g, 100 = ~0.005 g; twice the number reacts to half the movement.
  # Default min 0.3 (~1.6 g: picked up and turned), max 100.
  - platform: template
    id: motion_min
    name: "Motion sensitivity min"
    icon: mdi:speedometer-slow
    min_value: 0.05
    max_value: 1000
    step: 0.05
    initial_value: 0.3
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    on_value:
      - script.execute: motion_scale
  - platform: template
    id: motion_max
    name: "Motion sensitivity max"
    icon: mdi:speedometer
    min_value: 0.1
    max_value: 1000
    step: 0.1
    initial_value: 100
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    on_value:
      - script.execute: motion_scale
  # Full flash (clears e-ink ghosting) after this many fast refreshes
  - platform: template
    id: clean_after
    name: "Full refresh after"
    icon: mdi:broom
    unit_of_measurement: refreshes
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: sound_level
    name: "Touch sound volume"
    icon: mdi:volume-medium
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    restore_value: true
    mode: slider
    entity_category: config

  # Power off: how long to hold the battery (top right); unused while
  # "Power off on tap" is on
  - platform: template
    id: power_hold_s
    name: "Power off hold time"
    icon: mdi:gesture-tap-hold
    unit_of_measurement: s
    min_value: 0.1
    max_value: 10
    step: 0.1
    initial_value: 2
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    on_value:
      - lambda: |-
          lv_indev_t *in = lv_indev_get_next(nullptr);
          if (in != nullptr) lv_indev_set_long_press_time(in, (uint32_t) (x * 1000));
  # Hold a room row on Areas this long to open its lights (a tap toggles the room)
  - platform: template
    id: area_hold_s
    name: "Area menu hold time"
    icon: mdi:gesture-tap-hold
    unit_of_measurement: s
    min_value: 0.2
    max_value: 5
    step: 0.1
    initial_value: 0.6
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  # Power off by itself after being asleep this long (0 = never)
  - platform: template
    id: auto_off_hours
    name: "Power off after asleep"
    icon: mdi:power-sleep
    unit_of_measurement: h
    min_value: 0
    max_value: 168
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  # After the screen has gone to sleep, keep Wi-Fi and HA connected this long:
  # a tap or pick-up in that time acts at once instead of waiting ~2.5 s for
  # Wi-Fi and HA. 0 = off. Costs battery while connected (~10-20x asleep).
  - platform: template
    id: stay_min
    name: "Stay connected after sleep"
    icon: mdi:lan-connect
    unit_of_measurement: min
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

switch:
  # The tap that wakes the panel also does what it touched (off: it only wakes)
  - platform: template
    id: wake_tap_acts
    name: "Waking tap acts"
    icon: mdi:gesture-tap
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  # A single tap on the battery (top right) powers off (off: hold it instead)
  - platform: template
    id: power_on_tap
    name: "Power off on tap"
    icon: mdi:gesture-tap-button
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    id: touch_sound
    name: "Touch sound"
    icon: mdi:volume-high
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

# Areas, set in Home Assistant: per area a name, an icon, up to 6 lights, up
# to 4 scenes and its sensors. Lists are entity ids separated by commas
# ("light.a, light.b"); "light.a=Lamp" shows "Lamp" instead of HA's name.
# Sensors are "temperature, humidity, CO2" in that order (leave one out
# with an empty place: "climate.x, , sensor.co2"; a climate entity gives its
# current temperature / humidity). An area with nothing set is not shown,
# nor are empty light and scene places. The panel keeps them (power off
# included) and picks up changes within a few seconds.
text:
  - platform: template
    id: a1_name
    name: "Area 1 name"
    icon: mdi:form-textbox
    mode: text
    max_length: 40
    initial_value: "Kitchen"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value: &area_cfg_changed
      - script.execute: cfg_changed
  - platform: template
    id: a1_lights
    name: "Area 1 lights"
    icon: mdi:lightbulb-group
    mode: text
    max_length: 255
    initial_value: "light.kokken_spots, light.spisebord_kokken"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value: *area_cfg_changed
  - platform: template
    id: a1_scenes
    name: "Area 1 scenes"
    icon: mdi:palette
    mode: text
    max_length: 255
    initial_value: "scene.kokken_50_50, scene.aftensmad, scene.kokken_morgen"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value: *area_cfg_changed
  - platform: template
    id: a1_sensors
    name: "Area 1 sensors"
    icon: mdi:thermometer
    mode: text
    max_length: 255
    initial_value: "climate.danfoss_icon_2_gulvvarme_7, sensor.danfoss_icon_2_gulvvarme_humidity_7"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value: *area_cfg_changed
  - platform: template
    id: a2_name
    name: "Area 2 name"
    icon: mdi:form-textbox
    mode: text
    max_length: 40
    initial_value: "Living Room"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value: *area_cfg_changed
  - platform: template
    id: a2_lights
    name: "Area 2 lights"
    icon: mdi:lightbulb-group
    mode: text
    max_length: 255
    initial_value: "light.stue_lights_effective, light.stue_bord_lampe, light.stue_gulv_lampe, light.stander_lampe"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value: *area_cfg_changed
  - platform: template
    id: a2_scenes
    name: "Area 2 scenes"
    icon: mdi:palette
    mode: text
    max_length: 255
    initial_value: "scene.normal_stue, scene.hygge, scene.stue_amme_scene"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value: *area_cfg_changed
  - platform: template
    id: a2_sensors
    name: "Area 2 sensors"
    icon: mdi:thermometer
    mode: text
    max_length: 255
    initial_value: "climate.danfoss_icon_2_gulvvarme_9, sensor.danfoss_icon_2_gulvvarme_humidity_9"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value: *area_cfg_changed
  - platform: template
    id: a3_name
    name: "Area 3 name"
    icon: mdi:form-textbox
    mode: text
    max_length: 40
    initial_value: "sove værelse"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value: *area_cfg_changed
  - platform: template
    id: a3_lights
    name: "Area 3 lights"
    icon: mdi:lightbulb-group
    mode: text
    max_length: 255
    initial_value: "light.sovevaerelse_leklint, light.sovevaerelse_loft_lampe_white, light.sovevaerelse_loft_lampe_rgb"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value: *area_cfg_changed
  - platform: template
