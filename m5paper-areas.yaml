      - "\U000F0F48" # Office (chair-rolling)
      - "\U000F1239" # Desk
      - "\U000F072A" # Laundry (washing-machine)
      - "\U000F0F90" # Wardrobe
      - "\U000F081A" # Hallway (door)
      - "\U000F081C" # Entrance (door-open)
      - "\U000F04CD" # Stairs
      - "\U000F06D9" # Garage
      - "\U000F010B" # Car
      - "\U000F0531" # Garden (tree)
