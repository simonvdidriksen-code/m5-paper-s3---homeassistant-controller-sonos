# ---------------------------------------------------------------- screen

lvgl:
  displays:
    - epaper
  touchscreens:
    - touchscreen_id: touch
      # Only used by the power-off hold on the battery (top right)
      long_press_time: 2s
  # 270 = USB-C at the bottom (90 = USB-C at the top)
  rotation: 270
  buffer_size: 10%
  full_refresh: false
  draw_rounding: 8
  bg_color: 0xFFFFFF
  default_font: font_sub

  theme:
    button:
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0x000000
      border_width: 2
      radius: 10
      shadow_opa: TRANSP
      text_color: 0x000000

  style_definitions:
    - id: plain
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      shadow_opa: TRANSP
    - id: row_style
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0x000000
      border_width: 2
      radius: 10
      pad_left: 16
      pad_right: 10
      pad_top: 0
      pad_bottom: 0
      pad_column: 14
      shadow_opa: TRANSP
    - id: tab_style
      bg_opa: COVER
      border_color: 0x000000
      border_width: 2
      radius: 10
      pad_all: 0
      pad_column: 10
      shadow_opa: TRANSP
    - id: check_box
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0x000000
      border_width: 2
      radius: 6
      pad_all: 0
      shadow_opa: TRANSP
    - id: check_mark
      text_font: font_bulb
      text_color: 0xFFFFFF
    - id: vol_btn
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0x000000
      border_width: 2
      radius: 10
      pad_all: 0
      shadow_opa: TRANSP
    - id: vol_text
      text_font: font_vol
      text_color: 0x000000
    - id: area_icon
      text_font: font_icons
      text_color: 0x000000
    - id: bulb_icon
      text_font: font_bulb
      text_color: 0x000000
    - id: area_name
      text_font: font_name
      text_color: 0x000000
    - id: area_now
      text_font: font_sub
      text_color: 0x000000
    - id: area_sub
      text_font: font_sub
      text_color: 0x000000
    # Brightness bar on a room's lights screen (the black part is the level)
    - id: bri_bar
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0x000000
      border_width: 2
      radius: 8
      pad_all: 4
      shadow_opa: TRANSP

  # Shown above every page: last update, connecting icon, battery (top right)
  # and the tab bar
  top_layer:
    widgets:
      # Hold for 2 s: power off (with the "Slukket" screen)
      - obj:
          styles: plain
          align: TOP_RIGHT
          x: -20
          y: 16
          width: SIZE_CONTENT
          height: 48
          scrollable: false
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 4 }
          on_press:
            - script.execute: use_power_hold
          on_long_press:
            - if:
                condition:
                  lambda: "return !id(power_on_tap).state && millis() >= id(input_block_until);"
                then:
                  - script.execute: { id: power_off, reason: 0 }
          on_click:
            - if:
                condition:
                  lambda: "return id(power_on_tap).state && millis() >= id(input_block_until);"
                then:
                  - script.execute: { id: power_off, reason: 0 }
          widgets:
            - label: { id: lbl_updated, text: "", text_font: font_sub, text_color: 0x000000, pad_right: 8 }
            - label: { id: conn_icon, styles: bulb_icon, text: "\U000F16C7", pad_right: 4 }
            - label: { id: batt_icon, styles: area_icon, text: "\U000F008E" }
            - label: { id: batt_pct, text: "--%", text_font: font_name, text_color: 0x000000 }

      # Tab bar at the bottom
      - obj:
          styles: plain
          x: 16
          y: 880
          width: 508
          height: 64
          scrollable: false
          clickable: false
          layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
          widgets:
            - obj:
                id: tab_areas
                styles: tab_style
                bg_color: 0x000000
                text_color: 0xFFFFFF
                flex_grow: 1
                height: 100%
                scrollable: false
                layout: { type: FLEX, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER }
                on_press:
                  - script.execute: { id: show_page, idx: 0 }
                widgets:
                  - label: { text: "\U000F02DC", text_font: font_icons }
                  - label: { text: "Areas", text_font: font_name }
            - obj:
                id: tab_sonos
                styles: tab_style
                bg_color: 0xFFFFFF
                text_color: 0x000000
                flex_grow: 1
                height: 100%
                scrollable: false
                layout: { type: FLEX, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER }
                on_press:
                  - script.execute: { id: show_page, idx: 1 }
                widgets:
                  - label: { text: "\U000F0D38", text_font: font_icons }
                  - label: { text: "Sonos", text_font: font_name }

      # Power-off screen: drawn just before the power is cut; the e-ink keeps
      # showing it while the device is off. Covers (and blocks) everything.
      - obj:
          id: off_screen
          hidden: true
          x: 0
          y: 0
          width: 540
          height: 960
          bg_color: 0xFFFFFF
          bg_opa: COVER
          border_width: 0
          radius: 0
          shadow_opa: TRANSP
          pad_all: 48
          scrollable: false
          layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER, pad_row: 18 }
          widgets:
            - label: { id: off_icon, text: "\U000F0425", text_font: font_big_icon, text_color: 0x000000 }
            - label: { id: off_title, text: "Slukket", text_font: font_title, text_color: 0x000000 }
            - label: { id: off_text, text: "", text_font: font_name, text_color: 0x000000, text_align: CENTER, width: 100%, long_mode: WRAP }
            - label: { id: off_info, text: "", text_font: font_sub, text_color: 0x000000 }

  # Scrolling (incl. elastic over-scroll) is off on both pages: a palm or
  # finger drag could otherwise slide the screen sideways.
  pages:
    # ================================================================ Areas
    - id: areas_page
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            styles: plain
            x: 20
            y: 16
            width: SIZE_CONTENT
            height: 48
            scrollable: false
            clickable: false
            layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 10 }
            widgets:
              - label: { styles: area_icon, text: "\U000F02DC" }
              - label: { text: "Areas", text_font: font_title, text_color: 0x000000 }

        # Each whole row is the touch target; the bulb is an indicator.
        - obj:
            styles: plain
            x: 16
            y: 72
            width: 508
            height: 798
            scrollable: false
            clickable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              pad_row: 6
            widgets:
              # ---- area 1
              - obj:
                  id: ar_row0
                  styles: row_style
                  width: 100%
                  height: 61
                  scrollable: false
                  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER }
                  on_press:
                    - script.execute: use_area_hold
                  on_short_click:
                    - script.execute: { id: area_tap, idx: 0 }
                  on_long_press:
                    - script.execute: { id: open_area, idx: 0 }
                  widgets:
                    - label: { id: ar_icon0, styles: area_icon, text: "\U000F0FE6" }
                    - obj:
                        styles: plain
                        flex_grow: 1
                        height: SIZE_CONTENT
                        scrollable: false
                        clickable: false
                        layout: { type: FLEX, flex_flow: COLUMN, pad_row: 2 }
                        widgets:
                          - label: { id: ar_name0, styles: area_name, text: "", width: 100%, long_mode: DOT }
                          - label: { id: ar_sub0, styles: area_sub, text: "", width: 100%, long_mode: DOT }
                    - button:
                        id: ar_btn0
                        width: 72
                        height: 48
