button:
  - platform: template
    name: "Power off"
    icon: mdi:power
    on_press:
      - script.execute: { id: power_off, reason: 0 }
  # Sleep at once (also on USB power); a tap or movement wakes it as usual
  - platform: template
    name: "Sleep now"
    icon: mdi:sleep
    on_press:
      - script.execute: { id: go_sleep, full: true, forced: true }

# Passive buzzer (touch click)
output:
  - platform: ledc
    id: buzzer
    pin: GPIO21
    frequency: ${beep_hz}Hz

globals:
  # Refresh wanted on the e-ink: 1 = fast black/white (DU), 4 = full flash
  # (GC16, clears ghosting). The strongest one wanted wins.
  - id: ink_want
    type: int
    initial_value: "0"
  # Fast refreshes since the last full flash
  - id: du_count
    type: int
    initial_value: "0"
  # 0 = Areas, 1 = Sonos
  - id: current_page
    type: int
    initial_value: "0"
  # What LVGL drew into the e-ink buffer since the last refresh: whether any
  # pixel differs from what the panel shows, and which panel rows it touched
  - id: ink_dirty
    type: bool
    initial_value: "false"
  - id: ink_y0
    type: int
    initial_value: "540"
  - id: ink_y1
    type: int
    initial_value: "-1"

  # ---- Low power
  - id: last_activity          # millis() of the last touch or movement
    type: uint32_t
    initial_value: "0"
  - id: sleeping
    type: bool
    initial_value: "false"
  - id: refresh_wake           # woke by the refresh timer, not by the user
    type: bool
    initial_value: "false"
  - id: wake_reason            # 1 touch, 2 movement, 3 refresh timer
    type: int
    initial_value: "0"
  - id: wake_at
    type: uint32_t
    initial_value: "0"
  - id: next_refresh_at
    type: uint32_t
    initial_value: "0"
  - id: input_block_until      # the tap that wakes the panel doesn't act
    type: uint32_t
    initial_value: "0"
  - id: wake_tap               # that waking finger hasn't lifted yet
    type: bool
    initial_value: "false"
  - id: finger_down
    type: bool
    initial_value: "false"
  - id: sleep_since            # millis() when it last went to sleep
    type: uint32_t
    initial_value: "0"
  - id: sleep_s                # "Sleep after" in seconds, kept across reboots
    type: float
    restore_value: true
    initial_value: "60"
  - id: sleep_try_at           # millis() when go_sleep started its refresh
    type: uint32_t
    initial_value: "0"
  - id: motion_thr             # movement that counts, summed over x/y/z (0 = off)
    type: int
    initial_value: "0"
  - id: boot_drawn             # the first screen after boot is on the panel
    type: bool
    initial_value: "false"
  - id: wake_timing            # time the next "HA ready" (after boot / a wake)
    type: bool
    initial_value: "true"
  - id: wifi_timing            # time the next Wi-Fi connect (after boot / a wake)
    type: bool
    initial_value: "true"
  - id: dozing                 # screen asleep, Wi-Fi and HA still connected
    type: bool                 # ("Stay connected after sleep")
    initial_value: "false"
  - id: doze_since
    type: uint32_t
    initial_value: "0"
  - id: low_batt               # battery readings in a row below empty
    type: int
    initial_value: "0"
  - id: tp_active_low          # GT911 interrupt polarity, read before sleeping
    type: bool
    initial_value: "true"
  - id: acc_ref                # last accelerometer reading (x, y, z)
    type: "std::array<int16_t, 3>"
    initial_value: "std::array<int16_t, 3>{}"
  - id: api_ready              # Home Assistant connected
    type: bool
    initial_value: "false"
  - id: last_update_hm
    type: std::string
    initial_value: '""'

  # ---- Taps made before HA's states were in, sent by flush_queue
  - id: ha_heard               # HA has sent a state since it last connected
    type: bool
    initial_value: "false"
  - id: states_fresh           # HA has sent its current states since boot / wake
    type: bool
    initial_value: "false"
  - id: tap_queue_at           # last queued light / speaker tap (ms)
    type: uint32_t
    initial_value: "0"
  - id: area_queue             # bit per area: toggle it from HA's real state
    type: int
    initial_value: "0"
  - id: sonos_queue            # bit per speaker: play/pause from HA's real state
    type: int
    initial_value: "0"
  - id: fav_queue              # playlist button pressed (-1 = none)
    type: int
    initial_value: "-1"
  - id: combine_queue
    type: bool
    initial_value: "false"

  # ---- Areas: what the area settings in HA hold (filled in by cfg_apply).
  # The big arrays have no initial_value on purpose: one would be built on
  # the boot stack first (setup() overran its 16 KB and the panel reset).
  # They start zeroed / empty; on_boot sets the NAN and -1 ones.
  # Places for entity ids: lights 0-71 (area * 6 + n), scenes 72-119
  # (72 + area * 4 + n), sensors 120-155 (120 + area * 3: temperature,
  # humidity, CO2). HA's states are subscribed to by these (fixed) places, so
  # an id is at most 63 characters.
  - id: cfg_ents
    type: "std::array<std::array<char, 64>, 156>"
  - id: cfg_subbed             # place already subscribed to in HA
    type: "std::array<bool, 156>"
  - id: cfg_over               # lights and scenes: name given as "id=Name"
    type: "std::array<std::string, 120>"
  - id: cfg_fname              # lights and scenes: HA's friendly name
    type: "std::array<std::string, 120>"
  - id: cfg_label              # lights and scenes: the name shown
    type: "std::array<std::string, 120>"
  - id: cfg_val                # sensors: value from HA (NAN = unknown)
    type: "std::array<float, 36>"
  - id: area_title             # name on the Areas page and the lights screen
    type: "std::array<std::string, 12>"
  - id: area_list              # its lights, "light.a,light.b" (whole-area taps)
    type: "std::array<std::string, 12>"
  - id: area_nl                # lights per area (0-6)
    type: "std::array<uint8_t, 12>"
  - id: area_ns                # scenes per area (0-4)
    type: "std::array<uint8_t, 12>"
  - id: area_shown             # anything set for it
    type: "std::array<bool, 12>"
  - id: area_on
    type: "std::array<bool, 12>"
  - id: quiet_until            # HA reconnecting for new settings: no "connecting" icon
    type: uint32_t
    initial_value: "0"

  # ---- Single lights (lights screen), by place (area * 6 + n)
  - id: l_ha_on                # as HA last said
    type: "std::array<bool, 72>"
  - id: l_ha_bri               # 0..255 as HA last said (NAN = unknown, kept while off)
    type: "std::array<float, 72>"
  - id: light_on               # as the screen shows it
    type: "std::array<bool, 72>"
  - id: light_bri
    type: "std::array<float, 72>"
  - id: light_hold             # like hold_until, per light
    type: "std::array<uint32_t, 72>"
  - id: light_queue            # toggle from HA's real state when sent
    type: "std::array<bool, 72>"
  - id: bri_queue              # brightness % to send per light (-1 = none)
    type: "std::array<int8_t, 72>"
  - id: detail_area            # room shown on the lights screen
    type: int
    initial_value: "0"

  # ---- Scenes on a room's lights screen, by place (area * 4 + n)
  - id: scene_queue            # activate once HA is ready
    type: "std::array<bool, 48>"
  - id: scene_lit              # scene button shown black for a moment after a tap (-1 = none)
    type: int
    initial_value: "-1"
  # After a tap, keep the optimistic state until this time (ms) so stale HA
  # updates don't flip the button back before the device has reacted
  - id: hold_until
    type: "std::array<uint32_t, 12>"

  # ---- Sonos: per speaker (0 kitchen, 1 Living Room, 2 Bathroom, 3 kontor)
  - id: sonos_ents
    type: "std::array<const char *, 4>"
    initial_value: 'std::array<const char *, 4>{"media_player.kitchen", "media_player.living_room", "media_player.bathroom", "media_player.bedroom"}'
  - id: sonos_playing
    type: "std::array<bool, 4>"
    initial_value: "std::array<bool, 4>{}"
  - id: sonos_avail
    type: "std::array<bool, 4>"
    initial_value: "std::array<bool, 4>{}"
  - id: sonos_hold
    type: "std::array<uint32_t, 4>"
    initial_value: "std::array<uint32_t, 4>{}"
  - id: sonos_vol              # 0..1, NAN = unknown
    type: "std::array<float, 4>"
    initial_value: "std::array<float, 4>{NAN, NAN, NAN, NAN}"
  - id: vol_hold
    type: "std::array<uint32_t, 4>"
    initial_value: "std::array<uint32_t, 4>{}"
  - id: vol_targets            # how many speakers the last volume tap changed
    type: int
    initial_value: "0"
  - id: sonos_sel              # ticked rooms (bit per speaker), kept across reboots
    type: int
    restore_value: true
    initial_value: "0"
  - id: all_grouped            # every available speaker is in one group
    type: bool
    initial_value: "false"
  - id: group_hold_until
    type: uint32_t
    initial_value: "0"
  # Work values for playlist / group commands
  - id: pl_master
    type: std::string
    initial_value: '""'
  - id: pl_members
    type: std::string
    initial_value: '""'
  - id: pl_unjoin
    type: std::string
    initial_value: '""'
  - id: pl_unjoin_mask
    type: int
    initial_value: "0"
  - id: pl_fav
    type: std::string
    initial_value: '""'
  - id: pl_split
    type: bool
    initial_value: "false"
  # Sonos favorites as HA lists them (sensor.sonos_favorites): id and title,
  # and which one each playlist button matches (-1 = none / not known yet)
  - id: fav_items
    type: "std::vector<std::pair<std::string, std::string>>"
  - id: favs_known
    type: bool
    initial_value: "false"
  - id: fav_pick
    type: "std::array<int8_t, 4>"
    initial_value: "std::array<int8_t, 4>{-1, -1, -1, -1}"

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Copenhagen
    on_time:
      # Hourly full (GC16) refresh clears e-ink ghosting (while awake)
      - minutes: 0
        seconds: 0
        then:
          - if:
              condition:
                lambda: "return !id(sleeping);"
              then:
                - script.execute: refresh_subs
                - lambda: |-
                    id(ink_want) |= 4;
                    id(ink_bg).execute();

interval:
  # Safety net: subtitles also redraw every 5 min (while awake)
  - interval: 5min
    then:
      - if:
          condition:
            lambda: "return !id(sleeping);"
          then:
            - script.execute: refresh_subs

  # Awake and left alone after many fast refreshes: one full flash to clear ghosting.
  - interval: 15s
    then:
      - lambda: |-
          if (id(sleeping)) return;
          if (id(du_count) >= (int) id(clean_after).state && millis() - id(last_activity) > 30000) {
            id(ink_want) |= 4;
            id(ink_bg).execute();
          }

  # Asleep: one light-sleep cycle of up to 1 s. A touch wakes it at once; on
  # the 1 s timer it checks the motion sensor and the refresh timer.
  # Awake: movement counts as use; sleep after "Sleep after" seconds of no use.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: "return id(sleeping);"
          then:
            - lambda: |-
                const gpio_num_t tp = GPIO_NUM_48;
                const uint8_t tp_addr = id(touch)->get_i2c_address();
                static const uint8_t clear_status[3] = {0x81, 0x4E, 0x00};
                const int idle_level = id(tp_active_low) ? 1 : 0;
                // The GT911 holds its interrupt until its status is cleared
                if (gpio_get_level(tp) != idle_level) {
                  id(bus_internal)->write(tp_addr, clear_status, 3);
                  delay(5);
                  if (gpio_get_level(tp) != idle_level) {
                    id(wake_reason) = 1;  // a finger is on the screen
                    return;
                  }
                }
                // Swap the touch interrupt for a level wake-up while asleep
                gpio_intr_disable(tp);
                gpio_wakeup_enable(tp, id(tp_active_low) ? GPIO_INTR_LOW_LEVEL : GPIO_INTR_HIGH_LEVEL);
                esp_sleep_enable_gpio_wakeup();
                esp_sleep_enable_timer_wakeup(1000000ULL);
                esp_light_sleep_start();
                const esp_sleep_wakeup_cause_t cause = esp_sleep_get_wakeup_cause();
                gpio_wakeup_disable(tp);
                gpio_set_intr_type(tp, id(tp_active_low) ? GPIO_INTR_NEGEDGE : GPIO_INTR_POSEDGE);
                gpio_intr_enable(tp);
                if (cause == ESP_SLEEP_WAKEUP_GPIO) {
                  if (id(wake_tap_acts).state) {
                    // Leave the tap waiting in the touch chip and have the
                    // touch driver read it now, so the waking tap acts too
                    struct Poke : touchscreen::Touchscreen {
                      static void go(touchscreen::Touchscreen *t) { static_cast<Poke *>(t)->store_.touched = true; }
                    };
                    Poke::go(id(touch));
                  } else {
                    id(bus_internal)->write(tp_addr, clear_status, 3);
                  }
                  id(wake_reason) = 1;
                  return;
                }
                // Picked up or moved? (same threshold as the awake check below)
                uint8_t reg = 0x0C, d[6];
                if (id(motion_thr) > 0 && id(bus_internal)->write_readv(0x68, &reg, 1, d, 6) == i2c::ERROR_OK) {
                  int moved = 0;
                  for (int i = 0; i < 3; i++) {
                    const int16_t a = (int16_t) (d[2 * i] | (d[2 * i + 1] << 8));
                    moved += abs(a - id(acc_ref)[i]);
                    id(acc_ref)[i] = a;
                  }
                  if (moved > id(motion_thr)) {
                    id(wake_reason) = 2;
                    return;
                  }
                }
                const float r = id(refresh_minutes).state;
                if (!std::isnan(r) && r > 0 && (int32_t) (millis() - id(next_refresh_at)) >= 0)
                  id(wake_reason) = 3;
                // Asleep for longer than "Power off after asleep": power off
                const float h = id(auto_off_hours).state;
                if (!std::isnan(h) && h > 0 && millis() - id(sleep_since) > (uint32_t) (h * 3600000.0f))
                  id(wake_reason) = 4;
            - if:
                condition:
                  lambda: "return id(wake_reason) == 4;"
                then:
                  - lambda: |-
                      id(wake_reason) = 0;
                      id(sleeping) = false;
                  - script.execute: { id: power_off, reason: 0 }
            - if:
                condition:
                  lambda: "return id(wake_reason) != 0;"
                then:
                  - script.execute: wake_up
          else:
            - lambda: |-
                if (id(motion_thr) <= 0) return;  // motion sensitivity 0 = off
                uint8_t reg = 0x0C, d[6];
                if (id(bus_internal)->write_readv(0x68, &reg, 1, d, 6) != i2c::ERROR_OK) return;
                int moved = 0;
                for (int i = 0; i < 3; i++) {
                  const int16_t a = (int16_t) (d[2 * i] | (d[2 * i + 1] << 8));
                  moved += abs(a - id(acc_ref)[i]);
                  id(acc_ref)[i] = a;
                }
                if (moved > id(motion_thr)) id(last_activity) = millis();
            # Staying connected after sleep: movement (or USB) brings the screen
            # back; when "Stay connected after sleep" runs out, Wi-Fi goes off
            # as in a normal sleep
            - if:
                condition:
                  lambda: "return id(dozing) && !id(radio_off).is_running();"
                then:
                  - if:
                      condition:
                        lambda: "return (int32_t) (id(last_activity) - id(doze_since)) > 0 || id(usb_power).state;"
                      then:
                        - script.execute: doze_end
                      else:
                        - if:
                            condition:
                              lambda: |-
                                const float m = id(stay_min).state;
                                return std::isnan(m) || m <= 0 || millis() - id(doze_since) > (uint32_t) (m * 60000.0f);
                            then:
                              - script.execute: radio_off
                else:
                  - if:
                      condition:
                        lambda: |-
                          if (id(dozing) || id(usb_power).state || id(go_sleep).is_running() || id(radio_off).is_running())
                            return false;
                          // a refresh wake that never got through to HA gives up after a minute
                          if (id(refresh_wake)) return millis() - id(wake_at) > 60000;
                          // not before HA has the taps made since boot / waking (or a minute
                          // has gone by), so short sleep times still reach HA
                          if (!id(states_fresh) && millis() - id(wake_at) < 60000) return false;
                          const float s = std::isnan(id(sleep_s)) ? 60.0f : std::max(id(sleep_s), 1.0f);
                          return millis() - id(last_activity) > (uint32_t) (s * 1000.0f);
                      then:
                        - script.execute: { id: go_sleep, full: !lambda "return !id(refresh_wake);", forced: false }

# ---------------------------------------------------------------- hardware

i2c:
  sda: GPIO41
  scl: GPIO42
  id: bus_internal
  frequency: 200kHz

# BMI270: the driver uploads the chip's config at boot; on_boot then switches
# it to low power. It isn't polled; the intervals above read it directly.
motion:
  - platform: bmi270
    id: imu
    address: 0x68
    update_interval: never
    accelerometer_range: 2G

touchscreen:
  platform: gt911
  id: touch
  interrupt_pin: GPIO48
  # Maps touches into the panel's native 960x540 frame; LVGL's rotation below
  # applies to drawing and touch alike, so this stays the same if you rotate.
  # GT911 X runs along the short edge, Y along the long edge (axes swapped),
  # and the touch panel is mounted 180 degrees to the display (both mirrored).
  transform:
    swap_xy: true
    mirror_x: false
    mirror_y: true
  on_touch:
    - lambda: |-
        id(last_activity) = millis();
        id(finger_down) = true;
        // Staying connected after sleep: this touch brings the screen back. HA
        // never went away, so the tap acts at once (with "Waking tap acts" off
        // it only wakes; taps work again once the finger lifts).
        if (id(dozing) && !id(radio_off).is_running()) {
          if (!id(wake_tap_acts).state) {
            id(input_block_until) = millis() + 1500;
            id(wake_tap) = true;
            if (id(touch_sound).state) id(beep).execute();
          }
          id(doze_end).execute();
        }
        // Hand the press to LVGL right away. LVGL otherwise only looks every
        // ~33 ms and never sees a tap whose press and release arrive together,
        // which is what happens to a tap made while the screen refreshes.
        lv_indev_read(lv_indev_get_next(nullptr));
        // Click right away, before the screen catches up (not for the waking tap,
        // which already clicked in wake_up)
        if (id(touch_sound).state && millis() >= id(input_block_until)) id(beep).execute();
        if (id(refresh_wake)) {
          // woke for a screen refresh and now someone is using it: stay awake
          id(refresh_wake) = false;
          if (!id(api_ready)) {
            lv_label_set_text(id(lbl_updated), "");
            lv_label_set_text(id(conn_icon), "\U000F16C7");
            id(ink_want) |= 1;
            id(ink_fast).execute();
          }
        }
        ESP_LOGD("touch", "raw=(%d,%d) mapped=(%d,%d)", touch.x_raw, touch.y_raw, touch.x, touch.y);
  on_release:
    - lambda: |-
        id(finger_down) = false;
        // Hand the release to LVGL right away too: room taps act on release
        // (a hold opens the room instead), so this is when they happen
        lv_indev_read(lv_indev_get_next(nullptr));
        // The finger that woke the panel has lifted: taps work again at once
        if (id(wake_tap)) {
          id(wake_tap) = false;
          id(input_block_until) = millis();
        }

display:
  - platform: ed047tc1
    id: epaper
    pwr_pin: GPIO45
    bst_en_pin: GPIO46
    xstl_pin: GPIO13
    xle_pin: GPIO15
    spv_pin: GPIO17
    ckv_pin: GPIO18
    pclk_pin: GPIO16
    d0_pin: GPIO6
    d1_pin: GPIO14
    d2_pin: GPIO7
    d3_pin: GPIO12
    d4_pin: GPIO9
    d5_pin: GPIO11
    d6_pin: GPIO8
    d7_pin: GPIO10
    update_interval: never

# ---------------------------------------------------------------- HA data

binary_sensor:
  # Battery charger status (low while charging)
  - platform: gpio
    id: charging
    name: "Charging"
    device_class: battery_charging
    pin:
      number: GPIO4
      inverted: true
    filters:
      - delayed_on_off: 1s
    on_state:
      - script.execute: update_battery

  # On USB power: never sleep
  - platform: template
    id: usb_power
    name: "USB Power"
    device_class: plug
    lambda: "return id(usb_voltage).state > 3.0f || id(charging).state;"
    on_state:
      - script.execute: wifi_settle


text_sensor:
  # The panel's address on the network (shown on its device page in HA)
  - platform: wifi_info
    ip_address:
      name: "IP address"
      icon: mdi:ip-network
      entity_category: diagnostic

  # Sonos favorites for the playlist buttons. HA sends the attribute as Python
  # text: {'FV:2/4': 'alt det gode', 'SQ:0': 'Ss', ...}
  - platform: homeassistant
    id: sonos_favs
    entity_id: sensor.sonos_favorites
    attribute: items
    internal: true
    on_value:
      - lambda: |-
          std::vector<std::pair<std::string, std::string>> items;
          size_t i = 0;
          // next quoted string ('...' or "..."), with Python's backslash escapes
          auto next = [&](std::string &out) -> bool {
            while (i < x.size() && x[i] != '\'' && x[i] != '"') i++;
            if (i >= x.size()) return false;
            const char q = x[i++];
            out.clear();
            while (i < x.size() && x[i] != q) {
              if (x[i] == '\\' && i + 1 < x.size()) i++;
              out += x[i++];
            }
            i++;
            return true;
          };
          std::string key, title;
          while (next(key) && next(title)) items.emplace_back(key, title);
          id(fav_items) = std::move(items);
          id(favs_known) = true;
      - script.execute: pl_labels
      # a playlist button pressed before the favorites were in: play it now
      - lambda: |-
          if (id(fav_queue) >= 0 && id(states_fresh)) {
            const int q = id(fav_queue);
            id(fav_queue) = -1;
            id(play_fav).execute(q);
          }

  # Sonos: state + what's playing + group, per speaker
  # (on_raw_value fires on every state HA sends, also an unchanged one: it tells
  # on_client_connected that HA has subscribed and takes actions now)
  - { platform: homeassistant, id: sn0_state, entity_id: media_player.kitchen, internal: true, on_value: &sonos_changed [ script.execute: refresh_sonos ], on_raw_value: [ lambda: "id(ha_heard) = true;" ] }
  - { platform: homeassistant, id: sn0_title, entity_id: media_player.kitchen, attribute: media_title, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn0_artist, entity_id: media_player.kitchen, attribute: media_artist, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn0_channel, entity_id: media_player.kitchen, attribute: media_channel, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn0_group, entity_id: media_player.kitchen, attribute: group_members, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn1_state, entity_id: media_player.living_room, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn1_title, entity_id: media_player.living_room, attribute: media_title, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn1_artist, entity_id: media_player.living_room, attribute: media_artist, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn1_channel, entity_id: media_player.living_room, attribute: media_channel, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn1_group, entity_id: media_player.living_room, attribute: group_members, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn2_state, entity_id: media_player.bathroom, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn2_title, entity_id: media_player.bathroom, attribute: media_title, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn2_artist, entity_id: media_player.bathroom, attribute: media_artist, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn2_channel, entity_id: media_player.bathroom, attribute: media_channel, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn2_group, entity_id: media_player.bathroom, attribute: group_members, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn3_state, entity_id: media_player.bedroom, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn3_title, entity_id: media_player.bedroom, attribute: media_title, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn3_artist, entity_id: media_player.bedroom, attribute: media_artist, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn3_channel, entity_id: media_player.bedroom, attribute: media_channel, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn3_group, entity_id: media_player.bedroom, attribute: group_members, internal: true, on_value: *sonos_changed }

sensor:
  # Battery: voltage via a 1:2 divider on GPIO3, smoothed, then mapped to % (LiPo curve)
  - platform: adc
    id: battery_voltage
    name: "Battery Voltage"
    pin: GPIO3
    attenuation: 12db
    update_interval: 30s
    entity_category: diagnostic
    filters:
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 2
          send_first_at: 1
    # Empty (two readings in a row, on battery): power off with a message
    # instead of freezing on whatever the screen showed
    on_value:
      - lambda: |-
          if (x > 1.0f && x < 3.30f && !id(usb_power).state && !id(charging).state) id(low_batt)++;
          else id(low_batt) = 0;
          if (id(low_batt) >= 2 && !id(power_off).is_running()) id(power_off).execute(1);
  - platform: copy
    source_id: battery_voltage
    id: battery_level
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - lambda: |-
          static const float v[] = {3.27, 3.61, 3.69, 3.71, 3.73, 3.75, 3.77, 3.79, 3.80, 3.82, 3.84,
                                    3.85, 3.87, 3.91, 3.95, 3.98, 4.02, 4.08, 4.11, 4.15, 4.20};
          if (x <= v[0]) return 0.0f;
          for (int i = 1; i < 21; i++)
            if (x < v[i]) return roundf((i - 1) * 5.0f + 5.0f * (x - v[i - 1]) / (v[i] - v[i - 1]));
          return 100.0f;
      # Only redraw the e-ink when the level moves by 2% or more
      - delta: 2.0
    on_value:
      - script.execute: update_battery

  # Speed diagnostics (seconds). "Boot to screen ready": power-on until the
  # first screen is drawn (not counting the ~0.3 s bootloader). "Wake to HA
  # ready": from a wake (or boot) until HA takes commands and queued taps go out.
  - platform: template
    id: t_boot_screen
    name: "Boot to screen ready"
    icon: mdi:timer-outline
    unit_of_measurement: s
    accuracy_decimals: 2
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: t_wake_ha
    name: "Wake to HA ready"
    icon: mdi:timer-sync-outline
    unit_of_measurement: s
    accuracy_decimals: 2
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  # Part of that: from a wake (or boot) until Wi-Fi is connected
  - platform: template
    id: t_wake_wifi
    name: "Wake to Wi-Fi"
    icon: mdi:wifi-sync
    unit_of_measurement: s
    accuracy_decimals: 2
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  # How long the last screen refresh took (drawing + driving the panel)
  - platform: template
    id: t_refresh
    name: "Screen refresh time"
    icon: mdi:timer-outline
    unit_of_measurement: ms
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never

  # USB detect (GPIO5)
  - platform: adc
    id: usb_voltage
    pin: GPIO5
    attenuation: 12db
    update_interval: 10s
    internal: true
    filters:
      - multiply: 2.0

  # Sonos volume per speaker (0..1)
  - { platform: homeassistant, id: sn0_vol, entity_id: media_player.kitchen, attribute: volume_level, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn1_vol, entity_id: media_player.living_room, attribute: volume_level, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn2_vol, entity_id: media_player.bathroom, attribute: volume_level, internal: true, on_value: *sonos_changed }
  - { platform: homeassistant, id: sn3_vol, entity_id: media_player.bedroom, attribute: volume_level, internal: true, on_value: *sonos_changed }

# ---------------------------------------------------------------- logic

script:
  # ================================================================ e-ink
  # The one place the panel gets refreshed. While the panel is driven (longer
  # the more lines changed; a full flash takes about 2-3x the fast mode) the
  # driver keeps both CPU cores busy, so everything else waits; that's why the
  # screen is black/white only (fast mode for all) and background changes are
  # batched. The driver's own update()/partial_update() must not be used: they
  # copy ESPHome's display buffer, which LVGL no longer draws into.
  - id: ink_now
    then:
      - lambda: |-
          const int want = id(ink_want);
          if (want == 0) return;
          // Staying connected after sleep: the panel keeps its sleep picture;
          // what changed meanwhile is drawn when it wakes (doze_end)
          if (id(dozing)) return;
          id(ink_want) = 0;
          id(buzzer).turn_off();  // a click mustn't drone on through the refresh
          const uint32_t t0 = millis();
          lv_refr_now(nullptr);  // LVGL draws what's pending straight into the e-ink buffer
          if (want & 4) id(du_count) = 0;
          // Nothing on the screen changed (e.g. HA confirming what a tap already
          // shows): leave the panel alone
          if (!id(ink_dirty)) {
            id(ink_y0) = 540;
            id(ink_y1) = -1;
            return;
          }
          struct Ink : ed047tc1::ED047TC1Display {
            static EpdiyHighlevelState *state(ed047tc1::ED047TC1Display *d) { return &static_cast<Ink *>(d)->hl_state_; }
          };
          // Only the panel rows LVGL drew into since the last refresh are
          // compared with what the panel shows; only changed pixels are driven
          EpdRect area = epd_full_screen();
          if (id(ink_y0) <= id(ink_y1)) {
            area.y = id(ink_y0);
            area.height = id(ink_y1) - id(ink_y0) + 1;
          }
          id(ink_dirty) = false;
          id(ink_y0) = 540;
          id(ink_y1) = -1;
          epd_poweron();
          const enum EpdDrawError err = epd_hl_update_area(
              Ink::state(id(epaper)), (want & 4) ? MODE_GC16 : MODE_DU, epd_ambient_temperature(), area);
          epd_poweroff();
          if (err != EPD_DRAW_SUCCESS) {
            // compare the whole panel next time
            id(ink_dirty) = true;
            id(ink_y0) = 0;
            id(ink_y1) = 539;
          }
          if (!(want & 4)) id(du_count)++;
          id(t_refresh).publish_state(millis() - t0);
          // Timing: from power-on until the first screen is up
          if (!id(boot_drawn)) {
            id(boot_drawn) = true;
            id(t_boot_screen).publish_state(millis() / 1000.0f);
          }

  # After a tap: refresh almost at once (rapid taps share one refresh). The
  # 40 ms let the tap's HA command leave over Wi-Fi first: while the panel is
  # driven, both cores are busy.
  - id: ink_fast
    mode: restart
    then:
      - delay: 40ms
      - script.execute: ink_now

  # Background changes (sensors, states, battery): wait for the burst to end
  - id: ink_bg
    mode: restart
    then:
      - delay: 800ms
      - script.execute: ink_now

  # Short click from the buzzer. "Touch sound volume" 100 % = 50 % duty (loudest)
  - id: beep
    mode: restart
    then:
      - output.set_level:
          id: buzzer
          level: !lambda |-
            const float v = id(sound_level).state;
            return std::isnan(v) ? 0.5f : v / 200.0f;
      - delay: ${beep_ms}ms
      - output.turn_off: buzzer

  # Wi-Fi power saving: off on USB; on battery, on once HA has connected and
  # the first burst of state updates is through (every wake starts without it)
  - id: wifi_settle
    mode: restart
    then:
      - delay: 20s
      - lambda: |-
          // (staying connected after sleep has its own, deeper power saving)
          if (id(sleeping) || id(dozing) || !id(api_ready)) return;
          esp_wifi_set_ps(id(usb_power).state ? WIFI_PS_NONE : WIFI_PS_MIN_MODEM);

  # "Motion sensitivity" 1..100 -> a strength running evenly from "min" to "max"
  # -> the movement that counts. Strength 1 = 8000 (~0.5 g at 16384 per g,
  # summed over x/y/z); twice the strength, half the movement.
  - id: motion_scale
    then:
      - lambda: |-
          const float lvl = id(motion_level).state, lo = id(motion_min).state, hi = id(motion_max).state;
          if (std::isnan(lvl) || lvl <= 0 || std::isnan(lo) || std::isnan(hi)) {
            id(motion_thr) = 0;
            return;
          }
          const float strength = lo + (lvl - 1.0f) / 99.0f * (hi - lo);
          id(motion_thr) = strength > 0 ? std::max(1, (int) (8000.0f / strength)) : 0;

  # ================================================================ low power
  # Clean refresh, Wi-Fi off, then the 1 s interval above light-sleeps.
  # full = true: ghost-free full flash (after use); false: fast refresh after a
  # refresh wake, unless ghosting has built up. forced = "Sleep now" from HA,
  # which also works on USB power. With "Stay connected after sleep" set, a
  # sleep after use first keeps Wi-Fi and HA for that long (dozing); radio_off
  # then does the rest.
  - id: go_sleep
    parameters:
      full: bool
      forced: bool
    then:
      - if:
          condition:
            lambda: "return id(dozing);"
          then:
            # "Sleep now" while staying connected: Wi-Fi off straight away
            - if:
                condition:
                  lambda: "return forced && !id(radio_off).is_running();"
                then:
                  - script.execute: radio_off
          else:
            - if:
                condition:
                  lambda: "return !id(sleeping) && (forced || !id(usb_power).state);"
                then:
                  # Asleep it shows the Areas overview, not one room's lights
                  - if:
                      condition:
                        lambda: "return id(current_page) == 2;"
                      then:
                        - lvgl.page.show: { id: areas_page, animation: NONE }
                        - lambda: id(current_page) = 0;
                  - lambda: |-
                      id(sleep_try_at) = millis();
                      std::string t = "Sover";
                      if (!id(last_update_hm).empty()) t += " · opdateret " + id(last_update_hm);
                      lv_label_set_text(id(lbl_updated), t.c_str());
                      lv_label_set_text(id(conn_icon), "");
                      id(ink_want) |= (full || id(du_count) >= (int) id(clean_after).state) ? 4 : 1;
                  - script.execute: ink_now
                  # a tap made during that refresh is read just after it: stay awake
                  - delay: 300ms
                  - if:
                      condition:
                        lambda: "return (int32_t) (id(last_activity) - id(sleep_try_at)) > 0;"
                      then:
                        - script.execute: refresh_subs
                      else:
                        - if:
                            condition:
                              lambda: |-
                                // "Stay connected after sleep" (after use only, not for
                                // "Sleep now" or a refresh wake)
                                const float m = id(stay_min).state;
                                return full && !forced && !std::isnan(m) && m > 0;
                            then:
                              - lambda: |-
                                  id(dozing) = true;
                                  id(doze_since) = millis();
                                  // Radio sleeps through more beacons meanwhile: HA's updates
                                  // may wait up to ~0.3 s, taps still go out at once
                                  esp_wifi_set_ps(WIFI_PS_MAX_MODEM);
                            else:
                              - script.execute: radio_off

  # Wi-Fi off and light sleep: the end of go_sleep, or when "Stay connected
  # after sleep" runs out
  - id: radio_off
    then:
      - lambda: |-
          // Release the touch interrupt and learn its idle level
          static const uint8_t clear_status[3] = {0x81, 0x4E, 0x00};
          id(bus_internal)->write(id(touch)->get_i2c_address(), clear_status, 3);
          delay(5);
          id(tp_active_low) = gpio_get_level(GPIO_NUM_48) == 1;
          // Movement baseline
          uint8_t reg = 0x0C, d[6];
          if (id(bus_internal)->write_readv(0x68, &reg, 1, d, 6) == i2c::ERROR_OK)
            for (int i = 0; i < 3; i++) id(acc_ref)[i] = (int16_t) (d[2 * i] | (d[2 * i + 1] << 8));
          const float r = id(refresh_minutes).state;
          id(next_refresh_at) = millis() + (uint32_t) ((std::isnan(r) ? 0.0f : r) * 60000.0f);
          id(refresh_wake) = false;
          // Tell HA the panel is going away (as ESPHome's deep sleep does).
          // Otherwise HA keeps a dead connection once Wi-Fi is off and only
          // notices when it next sends something (up to ~20 s after the
          // panel is back); now it reconnects as soon as the panel
          // announces itself (mDNS) after waking.
          for (auto &c : api::global_api_server->active_clients())
            if (c->is_authenticated()) (void) c->send_message(api::DisconnectRequest());
      # let that go out before the radio stops
      - delay: 200ms
      - wifi.disable:
      - lambda: |-
          id(dozing) = false;
          id(sleeping) = true;
          id(sleep_since) = millis();

  # Woken while staying connected (touch, movement or USB): the screen comes
  # back at once and taps act straight away, as HA never went away
  - id: doze_end
    then:
      - if:
          condition:
            lambda: "return id(dozing);"
          then:
            - lambda: |-
                id(dozing) = false;
                id(last_activity) = millis();
                esp_wifi_set_ps(id(usb_power).state ? WIFI_PS_NONE : WIFI_PS_MIN_MODEM);
                // drop "Sover ..." (refresh_subs writes the time again)
                lv_label_set_text(id(lbl_updated), "");
                lv_label_set_text(id(conn_icon), id(api_ready) ? "" : "\U000F16C7");
                // everything that changed while dozing, in the fast mode
                id(ink_want) = (id(ink_want) & ~4) | 1;
                id(ink_fast).execute();
            - script.execute: refresh_subs

  - id: wake_up
    then:
      - lambda: |-
          const int reason = id(wake_reason);
          id(wake_reason) = 0;
          id(sleeping) = false;
          id(wake_at) = millis();
          id(wake_timing) = true;
          id(wifi_timing) = true;
          id(refresh_wake) = reason == 3;
          if (reason != 3) {
            id(last_activity) = millis();
            // "Waking tap acts" off: the tap that woke the panel only wakes it.
            // Taps work again as soon as that finger lifts (on_release), and
            // after 1.5 s at the most. (On: the touch driver handles that tap
            // like any other, click included.)
            if (reason == 1 && !id(wake_tap_acts).state) {
              id(input_block_until) = millis() + 1500;
              id(wake_tap) = true;
              if (id(touch_sound).state) id(beep).execute();
            }
            // fast black/white change: drop "Sover ..." and show the connecting icon
            lv_label_set_text(id(lbl_updated), "");
            lv_label_set_text(id(conn_icon), "\U000F16C7");
            id(ink_want) |= 1;
            id(ink_fast).execute();
          }
      - wifi.enable:
      # The waking finger was already gone (touch chip saw no more of it)
      - delay: 250ms
      - lambda: |-
          if (id(wake_tap) && !id(finger_down)) {
            id(wake_tap) = false;
            id(input_block_until) = millis();
          }

  # Power off with a message left on the e-ink (it keeps the image without
  # power). From HA ("Power off"), a 2 s hold on the battery at the top right,
  # or by itself when the battery is empty. The side button's double-press
  # can't do this: that button only reaches the power chip, which cuts power
  # without telling the ESP32.
  - id: power_off
    parameters:
      reason: int              # 0 = asked to, 1 = battery empty
    then:
      - lambda: |-
          // (staying connected after sleep holds refreshes back; this one must show)
          id(dozing) = false;
          if (reason == 1) {
            lv_label_set_text(id(off_icon), "\U000F0083");
            lv_label_set_text(id(off_title), "Batteriet er fladt");
            lv_label_set_text(id(off_text), "Sæt USB-C i for at oplade, og tryk så på knappen på siden for at tænde.");
          } else {
            lv_label_set_text(id(off_icon), "\U000F0425");
            lv_label_set_text(id(off_title), "Slukket");
            lv_label_set_text(id(off_text), "Tryk på knappen på siden for at tænde.");
          }
          std::string info;
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            char b[24];
            snprintf(b, sizeof(b), "Slukket kl. %02d:%02d", now.hour, now.minute);
            info = b;
          }
          const float p = id(battery_level).state;
          if (!std::isnan(p)) {
            if (!info.empty()) info += " · ";
            info += "batteri " + std::to_string((int) p) + " %";
          }
          lv_label_set_text(id(off_info), info.c_str());
          lv_obj_remove_flag(id(off_screen), LV_OBJ_FLAG_HIDDEN);
          id(ink_want) |= 4;
      - script.execute: ink_now
      # Leave cleanly: tell HA (else it keeps a dead connection for up to
      # ~20 s after the next power-on) and the access point (else it holds
      # the old association and the next Wi-Fi connect takes ~2.6 s longer)
      - lambda: |-
          for (auto &c : api::global_api_server->active_clients())
            if (c->is_authenticated()) (void) c->send_message(api::DisconnectRequest());
      - delay: 200ms
      - wifi.disable:
      # Switched off on purpose, so this firmware works: keep it. Otherwise a
      # power off soon after an install rolls back to the previous firmware on
      # the next boot (and settings that firmware lacks vanish from HA).
      - safe_mode.mark_successful
      - lambda: |-
          // Settings changed in the last second are still in RAM: write them now
          global_preferences->sync();
          // Ask the power chip to cut power: pulses on GPIO44 (what M5Stack's
          // own library does for the PaperS3)
          gpio_reset_pin(GPIO_NUM_44);
          gpio_set_direction(GPIO_NUM_44, GPIO_MODE_OUTPUT);
          for (int i = 0; i < 5; i++) {
            gpio_set_level(GPIO_NUM_44, 0);
            delay(50);
            gpio_set_level(GPIO_NUM_44, 1);
            delay(50);
          }
      # Still running: USB keeps it powered. Say so, then carry on as normal.
      - delay: 2s
      - wifi.enable:
      - lambda: |-
          lv_label_set_text(id(off_text), "Slukker ikke, mens USB er tilsluttet.");
          id(ink_want) |= 1;
      - script.execute: ink_now
      - delay: 4s
      - lambda: |-
          lv_obj_add_flag(id(off_screen), LV_OBJ_FLAG_HIDDEN);
          id(last_activity) = millis();
          id(ink_want) |= 4;
      - script.execute: ink_now

  # Send what was tapped before HA's states were in. Light and speaker taps
  # toggle from HA's real state (the screen may have been wrong); ones that
  # couldn't be sent for 2 minutes are dropped.
  # Plain C++ loops on purpose: ESPHome's "repeat" runs each round inside the
  # one before, and 44 rounds here overran the main loop's stack.
  - id: flush_queue
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (now - id(tap_queue_at) > 120000) {
            id(area_queue) = 0;
            id(sonos_queue) = 0;
            id(light_queue).fill(false);
            id(bri_queue).fill(-1);
            id(scene_queue).fill(false);
          }
          // The screen's guesses now only wait for HA's answer
          for (auto &h : id(hold_until))
            if ((int32_t) (h - now) > 4000) h = now + 4000;
          for (auto &h : id(light_hold))
            if ((int32_t) (h - now) > 4000) h = now + 4000;
          for (auto &h : id(sonos_hold))
            if ((int32_t) (h - now) > 4000) h = now + 4000;
          bool lights = false, speakers = false;
          // Scenes first, so room and light taps made after them still win
          for (int i = 0; i < 48; i++)
            if (id(scene_queue)[i] && id(cfg_ents)[72 + i][0]) {
              id(scene_send).execute(i);
              lights = true;
            }
          id(scene_queue).fill(false);
          for (int i = 0; i < 12; i++)
            if (((id(area_queue) >> i) & 1) && !id(area_list)[i].empty()) {
              id(toggle_area).execute(i);
              lights = true;
            }
          id(area_queue) = 0;
          // Single lights from the lights screen: a brightness tap sets it, a
          // bulb tap toggles from HA's real state
          for (int i = 0; i < 72; i++) {
            if (!id(cfg_ents)[i][0]) continue;
            if (id(bri_queue)[i] >= 0) {
              id(light_set_bri).execute(i);
              lights = true;
            } else if (id(light_queue)[i]) {
              id(light_toggle_ha).execute(i);
              lights = true;
            }
          }
          id(light_queue).fill(false);
          id(bri_queue).fill(-1);
          for (int i = 0; i < 4; i++)
            if ((id(sonos_queue) >> i) & 1) {
              id(toggle_sonos).execute(i);
              speakers = true;
            }
          id(sonos_queue) = 0;
          // Re-read HA once the devices have reacted
          if (lights) id(resync_lights).execute();
          if (speakers) id(resync_sonos).execute();
      - lambda: |-
          if (id(fav_queue) >= 0) {
            const int q = id(fav_queue);
            id(fav_queue) = -1;
            id(play_fav).execute(q);
          }
      - if:
          condition:
            lambda: "return id(combine_queue);"
          then:
            - lambda: id(combine_queue) = false;
            - script.execute: combine_zones

  # ================================================================ pages
  # Bottom bar: switch page and highlight the active tab. The new page always
  # gets the fast refresh (the full flash waits until the panel is left alone).
  - id: show_page
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: "return idx != id(current_page) && millis() >= id(input_block_until);"
          then:
            - if:
                condition:
                  lambda: "return idx == 0;"
                then:
                  - lvgl.page.show: { id: areas_page, animation: NONE }
            - if:
                condition:
                  lambda: "return idx == 1;"
                then:
                  - lvgl.page.show: { id: sonos_page, animation: NONE }
            # 2 = one room's lights (opened from Areas, so the Areas tab stays lit)
            - if:
                condition:
                  lambda: "return idx == 2;"
                then:
                  - lvgl.page.show: { id: area_detail_page, animation: NONE }
            - lambda: |-
                id(current_page) = idx;
                lv_obj_t *tabs[2] = {id(tab_areas), id(tab_sonos)};
                for (int i = 0; i < 2; i++) {
                  const bool sel = i == (idx == 1 ? 1 : 0);
                  lv_obj_set_style_bg_color(tabs[i], lv_color_hex(sel ? 0x000000 : 0xFFFFFF), LV_PART_MAIN);
                  lv_obj_set_style_text_color(tabs[i], lv_color_hex(sel ? 0xFFFFFF : 0x000000), LV_PART_MAIN);
                }
                id(ink_want) |= 1;
                id(ink_fast).execute();

  # ================================================================ area settings
  # An area setting changed in HA (or was restored at boot): apply it once
  # the typing has stopped
  - id: cfg_changed
    mode: restart
    then:
      - delay: 1s
      - script.execute: cfg_apply

  # Read the area settings: entity ids into their places, rows shown or
  # hidden, names and icons. A place that gets a (new) entity is subscribed
  # to in HA; while HA is connected that needs a reconnect (cfg_resub), as HA
  # only reads the subscriptions when it connects.
  - id: cfg_apply
    then:
      - lambda: |-
          text::Text *nm[12] = {id(a1_name), id(a2_name), id(a3_name), id(a4_name), id(a5_name), id(a6_name),
                                id(a7_name), id(a8_name), id(a9_name), id(a10_name), id(a11_name), id(a12_name)};
          text::Text *lt[12] = {id(a1_lights), id(a2_lights), id(a3_lights), id(a4_lights), id(a5_lights), id(a6_lights),
                                id(a7_lights), id(a8_lights), id(a9_lights), id(a10_lights), id(a11_lights), id(a12_lights)};
          text::Text *sc[12] = {id(a1_scenes), id(a2_scenes), id(a3_scenes), id(a4_scenes), id(a5_scenes), id(a6_scenes),
                                id(a7_scenes), id(a8_scenes), id(a9_scenes), id(a10_scenes), id(a11_scenes), id(a12_scenes)};
          text::Text *se[12] = {id(a1_sensors), id(a2_sensors), id(a3_sensors), id(a4_sensors), id(a5_sensors), id(a6_sensors),
                                id(a7_sensors), id(a8_sensors), id(a9_sensors), id(a10_sensors), id(a11_sensors), id(a12_sensors)};
          select::Select *ic[12] = {id(a1_icon), id(a2_icon), id(a3_icon), id(a4_icon), id(a5_icon), id(a6_icon),
                                    id(a7_icon), id(a8_icon), id(a9_icon), id(a10_icon), id(a11_icon), id(a12_icon)};
          lv_obj_t *row[12] = {id(ar_row0), id(ar_row1), id(ar_row2), id(ar_row3), id(ar_row4), id(ar_row5),
                               id(ar_row6), id(ar_row7), id(ar_row8), id(ar_row9), id(ar_row10), id(ar_row11)};
          lv_obj_t *icon[12] = {id(ar_icon0), id(ar_icon1), id(ar_icon2), id(ar_icon3), id(ar_icon4), id(ar_icon5),
                                id(ar_icon6), id(ar_icon7), id(ar_icon8), id(ar_icon9), id(ar_icon10), id(ar_icon11)};
          lv_obj_t *name[12] = {id(ar_name0), id(ar_name1), id(ar_name2), id(ar_name3), id(ar_name4), id(ar_name5),
                                id(ar_name6), id(ar_name7), id(ar_name8), id(ar_name9), id(ar_name10), id(ar_name11)};
          lv_obj_t *sub[12] = {id(ar_sub0), id(ar_sub1), id(ar_sub2), id(ar_sub3), id(ar_sub4), id(ar_sub5),
                               id(ar_sub6), id(ar_sub7), id(ar_sub8), id(ar_sub9), id(ar_sub10), id(ar_sub11)};
          lv_obj_t *btn[12] = {id(ar_btn0), id(ar_btn1), id(ar_btn2), id(ar_btn3), id(ar_btn4), id(ar_btn5),
                               id(ar_btn6), id(ar_btn7), id(ar_btn8), id(ar_btn9), id(ar_btn10), id(ar_btn11)};
          // Glyphs of the "Area N icon" options, in the same order
          static const char *const glyphs[] = {
            "\U000F0FE6", "\U000F02DC", "\U000F0290", "\U000F0A70", "\U000F04B9", "\U000F0502", "\U000F0FD4",
            "\U000F02E3", "\U000F1288", "\U000F09AB", "\U000F09A0", "\U000F1818", "\U000F0F48", "\U000F1239",
            "\U000F072A", "\U000F0F90", "\U000F081A", "\U000F081C", "\U000F04CD", "\U000F06D9", "\U000F010B",
            "\U000F0531", "\U000F024A", "\U000F1817", "\U000F1054", "\U000F0299", "\U000F0606", "\U000F01E6",
            "\U000F06B5", "\U000F0769"};
          static bool booted = false;

          struct Cfg {
            static std::string trim(const std::string &s) {
              size_t a = 0, b = s.size();
              while (a < b && isspace((unsigned char) s[a])) a++;
              while (b > a && isspace((unsigned char) s[b - 1])) b--;
              return s.substr(a, b - a);
            }
            // HA's names, tidied: "køkken spots" -> "Køkken spots",
            // "garage paneler z2m group" -> "Garage paneler"
            static std::string tidy(std::string s) {
              s = trim(s);
              for (const char *junk : {" z2m group", " z2m", " mqtt"}) {
                const size_t n = strlen(junk);
                if (s.size() > n && s.compare(s.size() - n, n, junk) == 0) s.resize(s.size() - n);
              }
              if (!s.empty() && s[0] >= 'a' && s[0] <= 'z') s[0] -= 32;
              // æ ø å é ... (UTF-8 C3 A0-BE, not ÷)
              else if (s.size() > 1 && (uint8_t) s[0] == 0xC3 && (uint8_t) s[1] >= 0xA0 &&
                       (uint8_t) s[1] <= 0xBE && (uint8_t) s[1] != 0xB7)
                s[1] -= 0x20;
              return s;
            }
            // The name a light or scene place shows
            static void relabel(int i) {
              std::string &l = id(cfg_label)[i];
              if (!id(cfg_over)[i].empty()) l = id(cfg_over)[i];
              else if (!id(cfg_fname)[i].empty()) l = tidy(id(cfg_fname)[i]);
              else {
                // until HA has sent its name: from the id ("light.stue_bord" -> "Stue bord")
                const char *e = id(cfg_ents)[i].data();
                const char *d = strchr(e, '.');
                std::string s(d != nullptr ? d + 1 : e);
                for (auto &c : s)
                  if (c == '_') c = ' ';
                l = tidy(s);
              }
            }
            static bool numeric(StringRef v) {
              if (v.empty()) return false;
              const char c = v.c_str()[0];
              return isdigit((unsigned char) c) || c == '-' || c == '.';
            }
            // Ask HA for a place's states (once per place; the subscription
            // reads the place, so a new id in it only needs a reconnect)
            static void subscribe(int p) {
              auto *api = api::global_api_server;
              const char *e = id(cfg_ents)[p].data();
              if (p < 72) {
                api->subscribe_home_assistant_state(e, nullptr, std::function<void(StringRef)>([p](StringRef v) {
                  id(ha_heard) = true;
                  id(l_ha_on)[p] = v == "on";
                  id(refresh_lights).execute();
                }));
                api->subscribe_home_assistant_state(e, "brightness", std::function<void(StringRef)>([p](StringRef v) {
                  if (Cfg::numeric(v)) id(l_ha_bri)[p] = atof(v.c_str());
                  id(refresh_lights).execute();
                }));
              }
              if (p < 120) {
                api->subscribe_home_assistant_state(e, "friendly_name", std::function<void(StringRef)>([p](StringRef v) {
                  id(cfg_fname)[p] = v.str();
                  Cfg::relabel(p);
                  id(refresh_lights).execute();
                }));
                return;
              }
              // Sensors: a sensor's state, or a climate entity's current
              // temperature / humidity
              const int k = p - 120, kind = k % 3;
              api->subscribe_home_assistant_state(e, nullptr, std::function<void(StringRef)>([k](StringRef v) {
                if (Cfg::numeric(v)) id(cfg_val)[k] = atof(v.c_str());
                else if (v == "unavailable" || v == "unknown") id(cfg_val)[k] = NAN;
                else return;  // a climate entity's mode ("heat")
                if (!id(subs_changed).is_running()) id(subs_changed).execute();
              }));
              if (kind < 2)
                api->subscribe_home_assistant_state(e, kind == 0 ? "current_temperature" : "current_humidity",
                                                    std::function<void(StringRef)>([k](StringRef v) {
                  if (!Cfg::numeric(v)) return;
                  id(cfg_val)[k] = atof(v.c_str());
                  if (!id(subs_changed).is_running()) id(subs_changed).execute();
                }));
            }
          };

          bool changed = false, resub = false;
          // Put an entity id (and its "=Name") into a place
          auto put = [&](int p, std::string ent, const std::string &over) {
            if (ent.size() > 63) {
              ESP_LOGW("areas", "Entity id too long (max 63): %s", ent.c_str());
              ent.clear();
            }
            char *buf = id(cfg_ents)[p].data();
            if (strcmp(buf, ent.c_str()) != 0) {
              strcpy(buf, ent.c_str());
              changed = true;
              if (p < 72) {
                id(l_ha_on)[p] = id(light_on)[p] = false;
                id(l_ha_bri)[p] = id(light_bri)[p] = NAN;
                id(light_hold)[p] = 0;
              } else if (p >= 120) {
                id(cfg_val)[p - 120] = NAN;
              }
              if (p < 120) id(cfg_fname)[p].clear();
              if (!ent.empty()) {
                resub = true;
                if (!id(cfg_subbed)[p]) {
                  Cfg::subscribe(p);
                  id(cfg_subbed)[p] = true;
                }
              }
            }
            if (p < 120) {
              id(cfg_over)[p] = over;
              Cfg::relabel(p);
            }
          };
          // "light.a, kitchen_spots=Spots, , light.c": ids (a missing domain is
          // added) with their names; empty places are kept (sensors use them)
          auto split = [](const std::string &s, const char *domain, std::vector<std::pair<std::string, std::string>> &out) {
            out.clear();
            size_t i = 0;
            while (i <= s.size()) {
              size_t j = s.find(',', i);
              if (j == std::string::npos) j = s.size();
              std::string item = Cfg::trim(s.substr(i, j - i)), over;
              const size_t eq = item.find('=');
              if (eq != std::string::npos) {
                over = Cfg::trim(item.substr(eq + 1));
                item = Cfg::trim(item.substr(0, eq));
              }
              for (auto &c : item) c = tolower((unsigned char) c);
              if (!item.empty() && item.find('.') == std::string::npos) item = std::string(domain) + "." + item;
              out.emplace_back(item, over);
              i = j + 1;
            }
          };

          std::vector<std::pair<std::string, std::string>> items;
          for (int a = 0; a < 12; a++) {
            // Lights: the first 6 set
            int n = 0;
            split(lt[a]->state, "light", items);
            id(area_list)[a].clear();
            for (auto &it : items) {
              if (it.first.size() > 63) ESP_LOGW("areas", "Entity id too long (max 63): %s", it.first.c_str());
              if (it.first.empty() || it.first.size() > 63) continue;
              if (n == 6) {
                ESP_LOGW("areas", "Area %d: only 6 lights are shown", a + 1);
                break;
              }
              put(a * 6 + n, it.first, it.second);
              if (!id(area_list)[a].empty()) id(area_list)[a] += ",";
              id(area_list)[a] += it.first;
              n++;
            }
            id(area_nl)[a] = n;
            for (; n < 6; n++) put(a * 6 + n, "", "");
            // Scenes: the first 4 set
            n = 0;
            split(sc[a]->state, "scene", items);
            for (auto &it : items) {
              if (it.first.size() > 63) ESP_LOGW("areas", "Entity id too long (max 63): %s", it.first.c_str());
              if (it.first.empty() || it.first.size() > 63) continue;
              if (n == 4) {
                ESP_LOGW("areas", "Area %d: only 4 scenes are shown", a + 1);
                break;
              }
              put(72 + a * 4 + n, it.first, it.second);
              n++;
            }
            id(area_ns)[a] = n;
            for (; n < 4; n++) put(72 + a * 4 + n, "", "");
            // Sensors: temperature, humidity, CO2 by position
            split(se[a]->state, "sensor", items);
            bool sens = false;
            for (int k = 0; k < 3; k++) {
              const std::string ent = k < (int) items.size() ? items[k].first : "";
              put(120 + a * 3 + k, ent, "");
              sens |= id(cfg_ents)[120 + a * 3 + k][0] != 0;
            }

            // The row on Areas: shown when anything is set for it
            std::string title = Cfg::trim(nm[a]->state);
            const bool shown = !title.empty() || id(area_nl)[a] > 0 || id(area_ns)[a] > 0 || sens;
            if (title.empty()) title = "Area " + std::to_string(a + 1);
            id(area_title)[a] = title;
            id(area_shown)[a] = shown;
            auto show = [](lv_obj_t *o, bool on) {
              if (on == lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN)) {
                if (on) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
                else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
              }
            };
            show(row[a], shown);
            show(sub[a], sens);
            show(btn[a], id(area_nl)[a] > 0);
            if (strcmp(lv_label_get_text(name[a]), title.c_str()) != 0) lv_label_set_text(name[a], title.c_str());
            const auto ix = ic[a]->active_index();
            const char *g = glyphs[ix.has_value() && *ix < sizeof(glyphs) / sizeof(glyphs[0]) ? *ix : 0];
            if (strcmp(lv_label_get_text(icon[a]), g) != 0) lv_label_set_text(icon[a], g);
          }

          if (changed) {
            // Taps waiting for HA may point at places that changed: drop them
            id(area_queue) = 0;
            id(light_queue).fill(false);
            id(bri_queue).fill(-1);
            id(scene_queue).fill(false);
            id(hold_until).fill(0);
            // HA must subscribe to the new ids: reconnect (not at boot, where
            // HA connects afterwards anyway)
            if (resub && booted && id(api_ready)) id(cfg_resub).execute();
          }
          booted = true;
          // The lights screen of an area that has nothing left: back to Areas
          if (id(current_page) == 2 && id(area_nl)[id(detail_area)] == 0 && id(area_ns)[id(detail_area)] == 0)
            id(show_page).execute(0);
      - script.execute: refresh_lights
      - script.execute: refresh_subs

  # New area settings while HA is connected: have HA reconnect, so it
  # subscribes to the new entities (it reads the list only when it connects).
  # The panel dials HA again right away; meanwhile taps are queued as usual.
  - id: cfg_resub
    mode: restart
    then:
      - delay: 3s
      - lambda: |-
          if (!id(api_ready) || id(sleeping) || id(dozing)) return;  // the next connection subscribes anyway
          id(quiet_until) = millis() + 15000;
          for (auto &c : api::global_api_server->active_clients())
            if (c->is_authenticated()) (void) c->send_message(api::DisconnectRequest());

  # ================================================================ lights
  # A room row was pressed: flip the button at once (fast black/white refresh)
  # and send the new state. Before HA's states are in (boot, wake) the screen
  # may be wrong, so the tap is queued as a toggle of the real lights instead.
  # HA's real state confirms or corrects the button a moment later.
  - id: area_tap
    mode: parallel
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: "return millis() >= id(input_block_until) && id(area_nl)[idx] > 0;"
          then:
            - lambda: |-
                id(area_on)[idx] = !id(area_on)[idx];
                if (id(api_ready) && id(states_fresh)) {
                  id(hold_until)[idx] = millis() + 4000;
                } else {
                  // a second tap before it's sent cancels the first
                  id(area_queue) ^= 1 << idx;
                  id(tap_queue_at) = millis();
                  id(hold_until)[idx] = millis() + (((id(area_queue) >> idx) & 1) ? 120000 : 0);
                }
                // the room's single lights follow (lights screen)
                for (int k = 0; k < id(area_nl)[idx]; k++) {
                  const int li = idx * 6 + k;
                  id(light_on)[li] = id(area_on)[idx];
                  id(light_hold)[li] = id(hold_until)[idx];
                }
            - if:
                condition:
                  lambda: "return id(api_ready) && id(states_fresh);"
                then:
                  - script.execute: { id: send_area, idx: !lambda "return idx;" }
                  - script.execute: resync_lights
            - script.execute: repaint_lights
            - lambda: |-
                id(ink_want) |= 1;
                id(ink_fast).execute();

  # Turn an area's lights to the state shown on screen (homeassistant.* so a
  # switch works in the list too)
  - id: send_area
    mode: parallel
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: "return id(area_on)[idx];"
          then:
            - homeassistant.action:
                action: homeassistant.turn_on
                data:
                  entity_id: !lambda "return id(area_list)[idx];"
          else:
            - homeassistant.action:
                action: homeassistant.turn_off
                data:
                  entity_id: !lambda "return id(area_list)[idx];"

  # Toggle an area from HA's real state, worked out by HA when it runs:
  # any light on -> those turn off; all off -> all turn on
  - id: toggle_area
    mode: parallel
    parameters:
      idx: int
    then:
      - homeassistant.action:
          action: homeassistant.toggle
          data_template:
            entity_id: "{% set l = ents.split(',') %}{% set on = l | select('is_state', 'on') | list %}{{ (on if on else l) | join(',') }}"
          variables:
            ents: !lambda "return id(area_list)[idx];"

  # Re-read HA once the device has had time to react (catches failed commands)
  - id: resync_lights
    mode: restart
    then:
      - delay: 4500ms
      - script.execute: refresh_lights

  # Take the light states from HA (except lights / rooms still held after a tap)
  - id: refresh_lights
    mode: restart
    then:
      # Debounce: groups report several members changing at once
      - delay: 300ms
      - lambda: |-
          const uint32_t now = millis();
          // Each light (brightness only when HA has a number; kept while off)
          for (int i = 0; i < 72; i++) {
            if (!id(cfg_ents)[i][0] || (int32_t) (now - id(light_hold)[i]) < 0) continue;
            id(light_on)[i] = id(l_ha_on)[i];
            if (!std::isnan(id(l_ha_bri)[i])) id(light_bri)[i] = id(l_ha_bri)[i];
          }
          // A room is on when any of its lights is
          for (int a = 0; a < 12; a++) {
            if ((int32_t) (now - id(hold_until)[a]) < 0) continue;
            bool any = false;
            for (int k = 0; k < id(area_nl)[a]; k++) any |= id(light_on)[a * 6 + k];
            id(area_on)[a] = any;
          }
      - script.execute: repaint_lights
      - script.execute: repaint_detail
      - lambda: |-
          if (id(current_page) == 0 || id(current_page) == 2) {
            id(ink_want) |= 1;
            id(ink_bg).execute();
          }

  # Draw all bulb buttons from area_on: black + lit bulb = on, white = off
  - id: repaint_lights
    then:
      - lambda: |-
          lv_obj_t *btn[12] = {id(ar_btn0), id(ar_btn1), id(ar_btn2), id(ar_btn3), id(ar_btn4), id(ar_btn5),
                               id(ar_btn6), id(ar_btn7), id(ar_btn8), id(ar_btn9), id(ar_btn10), id(ar_btn11)};
          lv_obj_t *bulb[12] = {id(ar_bulb0), id(ar_bulb1), id(ar_bulb2), id(ar_bulb3), id(ar_bulb4), id(ar_bulb5),
                                id(ar_bulb6), id(ar_bulb7), id(ar_bulb8), id(ar_bulb9), id(ar_bulb10), id(ar_bulb11)};
          for (int i = 0; i < 12; i++) {
            const bool on = id(area_on)[i];
            lv_obj_set_style_bg_color(btn[i], lv_color_hex(on ? 0x000000 : 0xFFFFFF), LV_PART_MAIN);
            lv_obj_set_style_text_color(bulb[i], lv_color_hex(on ? 0xFFFFFF : 0x000000), LV_PART_MAIN);
            lv_label_set_text(bulb[i], on ? "\U000F0335" : "\U000F0E50");
          }

  # ================================================================ one room's lights
  # LVGL has one long-press time per touch input, so each hold sets its own
  # when the finger lands: room rows the "Area menu hold time", the battery
  # (power off) the "Power off hold time".
  - id: use_area_hold
    then:
      - lambda: |-
          const float s = id(area_hold_s).state;
          lv_indev_set_long_press_time(lv_indev_get_next(nullptr), (uint32_t) ((std::isnan(s) ? 0.6f : s) * 1000));
  - id: use_power_hold
    then:
      - lambda: |-
          const float s = id(power_hold_s).state;
          lv_indev_set_long_press_time(lv_indev_get_next(nullptr), (uint32_t) ((std::isnan(s) ? 2.0f : s) * 1000));

  # Held a room row: open its lights screen (a second click says "you can let
  # go"); not for an area without lights or scenes
  - id: open_area
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: "return millis() >= id(input_block_until) && (id(area_nl)[idx] > 0 || id(area_ns)[idx] > 0);"
          then:
            - lambda: |-
                if (id(touch_sound).state) id(beep).execute();
                id(detail_area) = idx;
                id(scene_lit) = -1;
            - script.execute: repaint_detail
            - script.execute: { id: show_page, idx: 2 }

  # Fill the lights screen for its room: name, "Tændt · 60 %" / "Slukket",
  # bulb button and brightness bar per light, then its scenes; places not set
  # are hidden. 6 lights and 4 scenes share the screen: the light rows get
  # lower when they would not fit.
  - id: repaint_detail
    then:
      - lambda: |-
          lv_obj_t *row[6] = {id(dt_row0), id(dt_row1), id(dt_row2), id(dt_row3), id(dt_row4), id(dt_row5)};
          lv_obj_t *zone[6] = {id(dt_zone0), id(dt_zone1), id(dt_zone2), id(dt_zone3), id(dt_zone4), id(dt_zone5)};
          lv_obj_t *name[6] = {id(dt_name0), id(dt_name1), id(dt_name2), id(dt_name3), id(dt_name4), id(dt_name5)};
          lv_obj_t *st[6] = {id(dt_state0), id(dt_state1), id(dt_state2), id(dt_state3), id(dt_state4), id(dt_state5)};
          lv_obj_t *btn[6] = {id(dt_btn0), id(dt_btn1), id(dt_btn2), id(dt_btn3), id(dt_btn4), id(dt_btn5)};
          lv_obj_t *bulb[6] = {id(dt_bulb0), id(dt_bulb1), id(dt_bulb2), id(dt_bulb3), id(dt_bulb4), id(dt_bulb5)};
          lv_obj_t *bar[6] = {id(dt_bar0), id(dt_bar1), id(dt_bar2), id(dt_bar3), id(dt_bar4), id(dt_bar5)};
          // only touch what changed, so a refresh doesn't redraw the lot
          auto set = [](lv_obj_t *lbl, const char *s) {
            if (strcmp(lv_label_get_text(lbl), s) != 0) lv_label_set_text(lbl, s);
          };
          auto show = [](lv_obj_t *o, bool on) {
            if (on == lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN)) {
              if (on) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
              else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            }
          };
          auto height = [](lv_obj_t *o, int h) {
            if (lv_obj_get_style_height(o, LV_PART_MAIN) != h) lv_obj_set_height(o, h);
          };
          const int a = id(detail_area);
          const int nl = id(area_nl)[a], ns = id(area_ns)[a];
          set(id(dt_title), id(area_title)[a].c_str());
          // Row height: 120 px, less when the scenes need the room. The
          // scene block is its title (25 px) and rows of two 56 px buttons.
          const int srows = (ns + 1) / 2;
          const int scene_h = ns == 0 ? 0 : 8 + 25 + 8 + srows * 56 + (srows - 1) * 8 + 6;
          const int h = nl == 0 ? 120 : std::min(120, (750 - scene_h - (nl - 1) * 6) / nl);
          // Inside a row: the 48 px name line, then the brightness zone with
          // the bar (40 px at full height) and what's left as its margin
          const int zone_h = h - 10 - 48;
          const int bar_h = std::min(40, zone_h - 6);
          const int pad_top = (zone_h - bar_h) / 2 + 1;
          for (int r = 0; r < 6; r++) {
            show(row[r], r < nl);
            if (r >= nl) continue;
            height(row[r], h);
            height(zone[r], zone_h);
            height(bar[r], bar_h);
            if (lv_obj_get_style_pad_top(zone[r], LV_PART_MAIN) != pad_top) {
              lv_obj_set_style_pad_top(zone[r], pad_top, LV_PART_MAIN);
              lv_obj_set_style_pad_bottom(zone[r], zone_h - bar_h - pad_top, LV_PART_MAIN);
            }
            const int li = a * 6 + r;
            const bool on = id(light_on)[li];
            const float b = id(light_bri)[li];
            const int pct = std::isnan(b) ? 0 : std::max(1, (int) lroundf(b * 100.0f / 255.0f));
            set(name[r], id(cfg_label)[li].c_str());
            const std::string s = !on ? "Slukket" : (pct > 0 ? "Tændt · " + std::to_string(pct) + " %" : "Tændt");
            set(st[r], s.c_str());
            lv_obj_set_style_bg_color(btn[r], lv_color_hex(on ? 0x000000 : 0xFFFFFF), LV_PART_MAIN);
            lv_obj_set_style_text_color(bulb[r], lv_color_hex(on ? 0xFFFFFF : 0x000000), LV_PART_MAIN);
            set(bulb[r], on ? "\U000F0335" : "\U000F0E50");
            // a switch in the list has no brightness: no bar
            show(bar[r], strncmp(id(cfg_ents)[li].data(), "light.", 6) == 0);
            const int v = on ? pct : 0;
            if (lv_bar_get_value(bar[r]) != v) lv_bar_set_value(bar[r], v, LV_ANIM_OFF);
          }
          // Scenes (hidden in rooms without); the one just tapped shows black
          lv_obj_t *sc[4] = {id(dt_sc0), id(dt_sc1), id(dt_sc2), id(dt_sc3)};
          lv_obj_t *sct[4] = {id(dt_sc0_txt), id(dt_sc1_txt), id(dt_sc2_txt), id(dt_sc3_txt)};
          show(id(dt_scenes), ns > 0);
          for (int k = 0; k < 4; k++) {
            show(sc[k], k < ns);
            if (k >= ns) continue;
            const bool lit = id(scene_lit) == k;
            set(sct[k], id(cfg_label)[72 + a * 4 + k].c_str());
            lv_obj_set_style_bg_color(sc[k], lv_color_hex(lit ? 0x000000 : 0xFFFFFF), LV_PART_MAIN);
            lv_obj_set_style_text_color(sct[k], lv_color_hex(lit ? 0xFFFFFF : 0x000000), LV_PART_MAIN);
          }

  # The room's button on Areas follows its lights (any on = on)
  - id: area_from_lights
    then:
      - lambda: |-
          const int a = id(detail_area);
          bool any = false;
          uint32_t until = 0;
          for (int k = 0; k < id(area_nl)[a]; k++) {
            any |= id(light_on)[a * 6 + k];
            const uint32_t h = id(light_hold)[a * 6 + k];
            if ((int32_t) (h - until) > 0) until = h;
          }
          id(area_on)[a] = any;
          id(hold_until)[a] = until;
      - script.execute: repaint_lights

  # A light's box on the lights screen: switch that one light. Before HA is
  # ready (boot, wake) it's queued as a toggle of the real light, like room taps.
  - id: light_tap
    mode: parallel
    parameters:
      row: int
    then:
      - if:
          condition:
            lambda: "return millis() >= id(input_block_until) && row < id(area_nl)[id(detail_area)];"
          then:
            - lambda: |-
                const int li = id(detail_area) * 6 + row;
                id(light_on)[li] = !id(light_on)[li];
                if (id(states_fresh)) {
                  id(light_hold)[li] = millis() + 4000;
                } else {
                  // a second tap before it's sent cancels the first
                  id(light_queue)[li] = !id(light_queue)[li];
                  id(bri_queue)[li] = -1;
                  id(tap_queue_at) = millis();
                  id(light_hold)[li] = millis() + (id(light_queue)[li] ? 120000 : 0);
                }
            - if:
                condition:
                  lambda: "return id(states_fresh);"
                then:
                  - script.execute: { id: light_send, li: !lambda "return id(detail_area) * 6 + row;" }
                  - script.execute: resync_lights
            - script.execute: area_from_lights
            - script.execute: repaint_detail
            - lambda: |-
                id(ink_want) |= 1;
                id(ink_fast).execute();

  # Brightness bar: where you tap sets it, in 10 % steps (10 % at the left end,
  # 100 % at the right); also switches the light on (lights only, not switches)
  - id: light_bri_tap
    mode: parallel
    parameters:
      row: int
    then:
      - if:
          condition:
            lambda: |-
              return millis() >= id(input_block_until) && row < id(area_nl)[id(detail_area)] &&
                     strncmp(id(cfg_ents)[id(detail_area) * 6 + row].data(), "light.", 6) == 0;
          then:
            - lambda: |-
                lv_obj_t *bar[6] = {id(dt_bar0), id(dt_bar1), id(dt_bar2), id(dt_bar3), id(dt_bar4), id(dt_bar5)};
                lv_point_t p;
                lv_indev_get_point(lv_indev_get_next(nullptr), &p);
                lv_area_t box;
                lv_obj_get_coords(bar[row], &box);
                const int w = std::max(1, (int) lv_area_get_width(&box));
                const int level = std::max(1, std::min(10, (int) ceilf((p.x - box.x1 + 1) * 10.0f / w)));
                const int li = id(detail_area) * 6 + row;
                id(light_on)[li] = true;
                id(light_bri)[li] = level * 25.5f;
                if (id(states_fresh)) {
                  id(light_hold)[li] = millis() + 4000;
                } else {
                  id(bri_queue)[li] = level * 10;
                  id(light_queue)[li] = false;
                  id(tap_queue_at) = millis();
                  id(light_hold)[li] = millis() + 120000;
                }
            - if:
                condition:
                  lambda: "return id(states_fresh);"
                then:
                  - script.execute: { id: light_set_bri, li: !lambda "return id(detail_area) * 6 + row;" }
                  - script.execute: resync_lights
            - script.execute: area_from_lights
            - script.execute: repaint_detail
            - lambda: |-
                id(ink_want) |= 1;
                id(ink_fast).execute();

  # One light to the state shown on screen
  - id: light_send
    mode: parallel
    parameters:
      li: int
    then:
      - if:
          condition:
            lambda: "return id(light_on)[li];"
          then:
            - homeassistant.action:
                action: homeassistant.turn_on
                data:
                  entity_id: !lambda "return std::string(id(cfg_ents)[li].data());"
          else:
            - homeassistant.action:
                action: homeassistant.turn_off
                data:
                  entity_id: !lambda "return std::string(id(cfg_ents)[li].data());"

  # One light to the brightness shown on screen (switches it on)
  - id: light_set_bri
    mode: parallel
    parameters:
      li: int
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda "return std::string(id(cfg_ents)[li].data());"
            brightness_pct: !lambda "return std::to_string((int) lroundf(id(light_bri)[li] * 100.0f / 255.0f));"

  # One light toggled from its real state in HA (taps made before HA was ready)
  - id: light_toggle_ha
    mode: parallel
    parameters:
      li: int
    then:
      - homeassistant.action:
          action: homeassistant.toggle
          data:
            entity_id: !lambda "return std::string(id(cfg_ents)[li].data());"

  # Scene button: activate it in HA (queued until HA is ready). The button
  # shows black for a moment; the light rows then follow HA's new states.
  - id: scene_tap
    mode: parallel
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: "return millis() >= id(input_block_until) && slot < id(area_ns)[id(detail_area)];"
          then:
            - lambda: |-
                id(scene_lit) = slot;
                if (!id(states_fresh)) {
                  id(scene_queue)[id(detail_area) * 4 + slot] = true;
                  id(tap_queue_at) = millis();
                }
            - if:
                condition:
                  lambda: "return id(states_fresh);"
                then:
                  - script.execute: { id: scene_send, si: !lambda "return id(detail_area) * 4 + slot;" }
                  - script.execute: resync_lights
            - script.execute: repaint_detail
            - lambda: |-
                id(ink_want) |= 1;
                id(ink_fast).execute();
            - script.execute: scene_unlight

  # ...and back to white after 2 s (shares a refresh with the lights' new states)
  - id: scene_unlight
    mode: restart
    then:
      - delay: 2s
      - lambda: id(scene_lit) = -1;
      - script.execute: repaint_detail
      - lambda: |-
          if (id(current_page) == 2) {
            id(ink_want) |= 1;
            id(ink_bg).execute();
          }

  # A scene (or script) place: turn it on in HA
  - id: scene_send
    mode: parallel
    parameters:
      si: int
    then:
      - homeassistant.action:
          action: homeassistant.turn_on
          data:
            entity_id: !lambda "return std::string(id(cfg_ents)[72 + si].data());"

  # ================================================================ sonos
  # Right part of a speaker row: pause if it shows playing, else play.
  # Grouped Sonos speakers play/pause together, so flip the whole group on screen.
  - id: sonos_tap
    mode: parallel
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: "return millis() >= id(input_block_until) && id(sonos_avail)[idx];"
          then:
            - lambda: |-
                text_sensor::TextSensor *grp[4] = {id(sn0_group), id(sn1_group), id(sn2_group), id(sn3_group)};
                const bool known = id(api_ready) && id(states_fresh);
                if (!known) {
                  // Before HA's states are in the screen may be wrong: queue a
                  // play/pause toggle of the real speaker (a second tap cancels it)
                  id(sonos_queue) ^= 1 << idx;
                  id(tap_queue_at) = millis();
                }
                const bool pending = known || ((id(sonos_queue) >> idx) & 1);
                const uint32_t until = millis() + (pending ? (known ? 4000 : 120000) : 0);
                const bool was = id(sonos_playing)[idx];
                for (int i = 0; i < 4; i++) {
                  const bool same_group = i == idx || grp[idx]->state.find(id(sonos_ents)[i]) != std::string::npos;
                  if (same_group && id(sonos_avail)[i] && id(sonos_playing)[i] == was) {
                    id(sonos_playing)[i] = !was;
                    id(sonos_hold)[i] = until;
                  }
                }
            - if:
                condition:
                  lambda: "return id(api_ready) && id(states_fresh);"
                then:
                  - script.execute: { id: send_sonos, idx: !lambda "return idx;" }
                  - script.execute: resync_sonos
            - script.execute: repaint_sonos
            - lambda: |-
                id(ink_want) |= 1;
                id(ink_fast).execute();

  # Play or pause a speaker to match the screen
  - id: send_sonos
    mode: parallel
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: "return id(sonos_playing)[idx];"
          then:
            - homeassistant.action:
                action: media_player.media_play
                data:
                  entity_id: !lambda "return std::string(id(sonos_ents)[idx]);"
          else:
            - homeassistant.action:
                action: media_player.media_pause
                data:
                  entity_id: !lambda "return std::string(id(sonos_ents)[idx]);"

  # Play/pause a speaker from its real state (grouped speakers follow it)
  - id: toggle_sonos
    mode: parallel
    parameters:
      idx: int
    then:
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: !lambda "return std::string(id(sonos_ents)[idx]);"

  # Left part of a speaker row: tick / untick the room
  - id: sonos_select
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: "return millis() >= id(input_block_until);"
          then:
            - lambda: id(sonos_sel) = id(sonos_sel) ^ (1 << idx);
            - script.execute: repaint_sonos
            - lambda: |-
                id(ink_want) |= 1;
                id(ink_fast).execute();

  # A short message above the playlist buttons for a few seconds
  - id: show_hint
    mode: restart
    parameters:
      msg: string
    then:
      - lambda: |-
          lv_label_set_text(id(lbl_pl_hint), msg.c_str());
          id(ink_want) |= 1;
          id(ink_fast).execute();
      - delay: 4s
      - lambda: |-
          lv_label_set_text(id(lbl_pl_hint), "Afspil på valgte rum");
          id(ink_want) |= 1;
          id(ink_bg).execute();

  # Nothing ticked: say so
  - id: show_pick_hint
    then:
      - script.execute: { id: show_hint, msg: "Vælg mindst ét rum ovenfor" }

  # Playlist / radio button: play a Sonos favorite on the ticked rooms. The
  # first ticked room leads; the other ticked rooms join it; rooms that were
  # grouped with them but aren't ticked are split off first.
  - id: play_fav
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: |-
              text::Text *nm[4] = {id(pl_name0), id(pl_name1), id(pl_name2), id(pl_name3)};
              return millis() >= id(input_block_until) && !nm[idx]->state.empty();
          then:
            - lambda: |-
                // The favorite this button matches (pl_labels works it out)
                const int pick = id(fav_pick)[idx];
                text_sensor::TextSensor *grp[4] = {id(sn0_group), id(sn1_group), id(sn2_group), id(sn3_group)};
                auto add = [](std::string &list, const char *e) {
                  if (!list.empty()) list += ",";
                  list += e;
                };
                auto ticked = [](int i) { return ((id(sonos_sel) >> i) & 1) && id(sonos_avail)[i]; };
                std::string master, members, unjoin;
                int unjoin_mask = 0;
                for (int i = 0; i < 4; i++) {
                  if (!ticked(i)) continue;
                  if (master.empty()) master = id(sonos_ents)[i];
                  else add(members, id(sonos_ents)[i]);
                }
                for (int i = 0; i < 4; i++) {
                  if (ticked(i) || !id(sonos_avail)[i]) continue;
                  for (int j = 0; j < 4; j++) {
                    if (ticked(j) && grp[j]->state.find(id(sonos_ents)[i]) != std::string::npos) {
                      add(unjoin, id(sonos_ents)[i]);
                      unjoin_mask |= 1 << i;
                      break;
                    }
                  }
                }
                id(pl_master) = master;
                id(pl_members) = members;
                id(pl_unjoin) = unjoin;
                id(pl_unjoin_mask) = unjoin_mask;
                id(pl_fav) = pick >= 0 ? id(fav_items)[pick].first : std::string();
            - if:
                condition:
                  lambda: "return id(pl_master).empty();"
                then:
                  - script.execute: show_pick_hint
            # The name isn't (or is no longer) one of the Sonos favorites
            - if:
                condition:
                  lambda: "return !id(pl_master).empty() && id(favs_known) && id(pl_fav).empty();"
                then:
                  - script.execute: { id: show_hint, msg: "Findes ikke i Sonos-favoritter" }
            - if:
                condition:
                  lambda: "return !id(pl_master).empty() && !(id(favs_known) && id(pl_fav).empty());"
                then:
                  # Show it right away: ticked rooms play, split-off rooms stop
                  - lambda: |-
                      const uint32_t until = millis() + (id(states_fresh) ? 6000 : 120000);
                      for (int i = 0; i < 4; i++) {
                        const bool tick = ((id(sonos_sel) >> i) & 1) && id(sonos_avail)[i];
                        if (tick || ((id(pl_unjoin_mask) >> i) & 1)) {
                          id(sonos_playing)[i] = tick;
                          id(sonos_hold)[i] = until;
                        }
                      }
                  - script.execute: repaint_sonos
                  - lambda: |-
                      id(ink_want) |= 1;
                      id(ink_fast).execute();
                  # Until HA is ready for commands (just after connecting too) and
                  # its favorites are in, queue it
                  - if:
                      condition:
                        lambda: "return !id(states_fresh) || !id(favs_known);"
                      then:
                        - lambda: id(fav_queue) = idx;
                      else:
                        - if:
                            condition:
                              lambda: "return !id(pl_unjoin).empty();"
                            then:
                              - homeassistant.action:
                                  action: media_player.unjoin
                                  data:
                                    entity_id: !lambda "return id(pl_unjoin);"
                              - delay: 500ms
                        - if:
                            condition:
                              lambda: "return !id(pl_members).empty();"
                            then:
                              # group_members must reach HA as a list: HA splits
                              # the comma-separated text (a plain string is refused)
                              - homeassistant.action:
                                  action: media_player.join
                                  data:
                                    entity_id: !lambda "return id(pl_master);"
                                  data_template:
                                    group_members: "{{ members.split(',') }}"
                                  variables:
                                    members: !lambda "return id(pl_members);"
                              - delay: 1s
                        - homeassistant.action:
                            action: media_player.play_media
                            data:
                              entity_id: !lambda "return id(pl_master);"
                              media_content_type: favorite_item_id
                              media_content_id: !lambda "return id(pl_fav);"
                        - script.execute: resync_sonos

  # Playlist buttons: match each name from HA to a Sonos favorite, then show
  # the favorite's name (or the name as typed, until HA has sent the
  # favorites) and the icon picked in HA. An empty name hides the button.
  - id: pl_labels
    then:
      - lambda: |-
          text::Text *nm[4] = {id(pl_name0), id(pl_name1), id(pl_name2), id(pl_name3)};
          select::Select *ic[4] = {id(pl_icon0), id(pl_icon1), id(pl_icon2), id(pl_icon3)};
          auto trim = [](const std::string &s) {
            size_t a = 0, b = s.size();
            while (a < b && isspace((unsigned char) s[a])) a++;
            while (b > a && isspace((unsigned char) s[b - 1])) b--;
            return s.substr(a, b - a);
          };
          // lower case, also Æ Ø Å É ... (UTF-8 C3 80-9E, not ×)
          auto fold = [&](const std::string &s) {
            std::string f = trim(s);
            for (size_t k = 0; k < f.size(); k++) {
              const uint8_t c = f[k];
              if (c >= 'A' && c <= 'Z') f[k] = c + 32;
              else if (c == 0xC3 && k + 1 < f.size() && (uint8_t) f[k + 1] >= 0x80 &&
                       (uint8_t) f[k + 1] <= 0x9E && (uint8_t) f[k + 1] != 0x97) {
                f[k + 1] += 0x20;
                k++;
              }
            }
            return f;
          };
          const auto &items = id(fav_items);
          for (int i = 0; i < 4; i++) {
            const std::string name = trim(nm[i]->state);
            int pick = -1;
            if (!name.empty()) {
              const std::string want = fold(name);
              // the favorite's id ("FV:2/16"), else its name
              for (size_t k = 0; k < items.size() && pick < 0; k++)
                if (items[k].first == name || fold(items[k].second) == want) pick = k;
              // "The Voice (2)": the second favorite with that name
              const size_t p = name.rfind(" (");
              const int nth = (p != std::string::npos && name.back() == ')') ? atoi(name.c_str() + p + 2) : 0;
              if (pick < 0 && nth >= 1) {
                const std::string base = fold(name.substr(0, p));
                int seen = 0;
                for (size_t k = 0; k < items.size() && pick < 0; k++)
                  if (fold(items[k].second) == base && ++seen == nth) pick = k;
              }
              // part of a name ("lofi")
              for (size_t k = 0; k < items.size() && pick < 0; k++)
                if (fold(items[k].second).find(want) != std::string::npos) pick = k;
            }
            id(fav_pick)[i] = pick;
          }
          if (id(pl_txt0) == nullptr) return;  // screen not built yet (settings restored at boot)
          lv_obj_t *btn[4] = {id(pl_btn0), id(pl_btn1), id(pl_btn2), id(pl_btn3)};
          lv_obj_t *txt[4] = {id(pl_txt0), id(pl_txt1), id(pl_txt2), id(pl_txt3)};
          lv_obj_t *ico[4] = {id(pl_ico0), id(pl_ico1), id(pl_ico2), id(pl_ico3)};
          for (int i = 0; i < 4; i++) {
            const std::string name = trim(nm[i]->state);
            if (name.empty()) lv_obj_add_flag(btn[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_remove_flag(btn[i], LV_OBJ_FLAG_HIDDEN);
            const int pick = id(fav_pick)[i];
            const std::string shown = pick >= 0 ? items[pick].second : name;
            if (shown != lv_label_get_text(txt[i])) lv_label_set_text(txt[i], shown.c_str());
            const auto ai = ic[i]->active_index();
            const char *g = (ai.has_value() && *ai == 1) ? "\U000F0439" : "\U000F0CB8";
            if (strcmp(g, lv_label_get_text(ico[i])) != 0) lv_label_set_text(ico[i], g);
          }
          if (id(current_page) == 1 && !id(sleeping)) {
            id(ink_want) |= 1;
            id(ink_bg).execute();
          }

  # Volume buttons -5 / -2 / +2 / +5 % on the ticked rooms. The number changes
  # at once; the command goes out once the taps stop (or when HA is connected).
  - id: vol_step
    parameters:
      delta: int
    then:
      - if:
          condition:
            lambda: "return millis() >= id(input_block_until);"
          then:
            - lambda: |-
                int n = 0;
                for (int i = 0; i < 4; i++) {
                  if (!((id(sonos_sel) >> i) & 1) || !id(sonos_avail)[i] || std::isnan(id(sonos_vol)[i])) continue;
                  const float v = roundf(id(sonos_vol)[i] * 100.0f + delta) / 100.0f;
                  id(sonos_vol)[i] = std::max(0.0f, std::min(1.0f, v));
                  id(vol_hold)[i] = millis() + (id(states_fresh) ? 5000 : 120000);
                  n++;
                }
                id(vol_targets) = n;
            - if:
                condition:
                  lambda: "return id(vol_targets) == 0;"
                then:
                  - script.execute: show_pick_hint
                else:
                  - script.execute: repaint_sonos
                  - lambda: |-
                      id(ink_want) |= 1;
                      id(ink_fast).execute();
                  - script.execute: vol_send

  - id: vol_send
    mode: restart
    then:
      - delay: 400ms
      # HA takes commands once it's ready (states in), not just connected
      - wait_until:
          condition:
            lambda: "return id(states_fresh);"
          timeout: 120s
      - if:
          condition:
            lambda: "return id(states_fresh);"
          then:
            - repeat:
                count: 4
                then:
                  - if:
                      condition:
                        lambda: |-
                          return ((id(sonos_sel) >> iteration) & 1) && id(sonos_avail)[iteration] &&
                                 !std::isnan(id(sonos_vol)[iteration]);
                      then:
                        - lambda: id(vol_hold)[iteration] = millis() + 5000;
                        - homeassistant.action:
                            action: media_player.volume_set
                            data:
                              entity_id: !lambda "return std::string(id(sonos_ents)[iteration]);"
                              volume_level: !lambda |-
                                char b[8];
                                snprintf(b, sizeof(b), "%.2f", id(sonos_vol)[iteration]);
                                return std::string(b);
            - script.execute: resync_sonos

  # Group button: join every available speaker (to whichever one is playing),
  # or, when they're all grouped already, split them (the leader keeps playing)
  - id: combine_zones
    then:
      - if:
          condition:
            lambda: "return millis() >= id(input_block_until);"
          then:
            - if:
                condition:
                  lambda: "return !id(states_fresh);"
                then:
                  - lambda: id(combine_queue) = true;
                else:
                  - lambda: |-
                      text_sensor::TextSensor *grp[4] = {id(sn0_group), id(sn1_group), id(sn2_group), id(sn3_group)};
                      auto add = [](std::string &list, const char *e) {
                        if (!list.empty()) list += ",";
                        list += e;
                      };
                      id(pl_split) = id(all_grouped);
                      id(pl_master) = "";
                      id(pl_members) = "";
                      id(pl_unjoin) = "";
                      if (id(all_grouped)) {
                        // HA lists the group leader first in group_members
                        int leader = -1;
                        size_t best = std::string::npos;
                        for (int i = 0; i < 4; i++) {
                          if (!id(sonos_avail)[i]) continue;
                          for (int j = 0; j < 4; j++) {
                            const size_t p = grp[j]->state.find(id(sonos_ents)[i]);
                            if (id(sonos_avail)[j] && p != std::string::npos && p < best) { best = p; leader = i; }
                          }
                        }
                        std::string unjoin;
                        for (int i = 0; i < 4; i++)
                          if (id(sonos_avail)[i] && i != leader) add(unjoin, id(sonos_ents)[i]);
                        id(pl_unjoin) = unjoin;
                      } else {
                        int m = -1;
                        for (int i = 0; i < 4 && m < 0; i++)
                          if (id(sonos_avail)[i] && id(sonos_playing)[i]) m = i;
                        for (int i = 0; i < 4 && m < 0; i++)
                          if (id(sonos_avail)[i] && ((id(sonos_sel) >> i) & 1)) m = i;
                        for (int i = 0; i < 4 && m < 0; i++)
                          if (id(sonos_avail)[i]) m = i;
                        if (m >= 0) {
                          std::string members;
                          for (int i = 0; i < 4; i++)
                            if (id(sonos_avail)[i] && i != m) add(members, id(sonos_ents)[i]);
                          id(pl_master) = id(sonos_ents)[m];
                          id(pl_members) = members;
                        }
                      }
                      // flip the button label now; HA confirms shortly
                      id(all_grouped) = !id(all_grouped);
                      id(group_hold_until) = millis() + 6000;
                  - if:
                      condition:
                        lambda: "return id(pl_split) && !id(pl_unjoin).empty();"
                      then:
                        - homeassistant.action:
                            action: media_player.unjoin
                            data:
                              entity_id: !lambda "return id(pl_unjoin);"
                  - if:
                      condition:
                        lambda: "return !id(pl_split) && !id(pl_members).empty();"
                      then:
                        # (group_members as a list, see play_fav)
                        - homeassistant.action:
                            action: media_player.join
                            data:
                              entity_id: !lambda "return id(pl_master);"
                            data_template:
                              group_members: "{{ members.split(',') }}"
                            variables:
                              members: !lambda "return id(pl_members);"
                  - script.execute: repaint_sonos
                  - lambda: |-
                      id(ink_want) |= 1;
                      id(ink_fast).execute();
                  - script.execute: resync_sonos

  # Re-read the speakers just after the screen's guesses run out (refresh_sonos
  # starts it again while any guess is still pending)
  - id: sonos_settle
    mode: restart
    parameters:
      ms: int
    then:
      - delay: !lambda "return ms + 100;"
      # (asleep: no extra e-ink refresh; waking reads everything anyway)
      - if:
          condition:
            lambda: "return !id(sleeping);"
          then:
            - script.execute: refresh_sonos

  - id: resync_sonos
    mode: restart
    then:
      - delay: 4500ms
      - script.execute: refresh_sonos

  # Take the speaker states from HA and rewrite their text lines
  - id: refresh_sonos
    mode: restart
    then:
      - delay: 400ms
      - lambda: |-
          text_sensor::TextSensor *st[4] = {id(sn0_state), id(sn1_state), id(sn2_state), id(sn3_state)};
          text_sensor::TextSensor *title[4] = {id(sn0_title), id(sn1_title), id(sn2_title), id(sn3_title)};
          text_sensor::TextSensor *artist[4] = {id(sn0_artist), id(sn1_artist), id(sn2_artist), id(sn3_artist)};
          text_sensor::TextSensor *channel[4] = {id(sn0_channel), id(sn1_channel), id(sn2_channel), id(sn3_channel)};
          text_sensor::TextSensor *grp[4] = {id(sn0_group), id(sn1_group), id(sn2_group), id(sn3_group)};
          sensor::Sensor *vol[4] = {id(sn0_vol), id(sn1_vol), id(sn2_vol), id(sn3_vol)};
          lv_obj_t *np[4] = {id(sn_np0), id(sn_np1), id(sn_np2), id(sn_np3)};
          lv_obj_t *stl[4] = {id(sn_st0), id(sn_st1), id(sn_st2), id(sn_st3)};
          const uint32_t now = millis();
          for (int i = 0; i < 4; i++) {
            const std::string &s = st[i]->state;
            const bool avail = !(s.empty() || s == "unavailable" || s == "unknown");
            const bool active = s == "playing" || s == "paused";
            id(sonos_avail)[i] = avail;
            if ((int32_t) (now - id(sonos_hold)[i]) >= 0) id(sonos_playing)[i] = s == "playing";
            if ((int32_t) (now - id(vol_hold)[i]) >= 0 && !std::isnan(vol[i]->state)) id(sonos_vol)[i] = vol[i]->state;

            // What's playing: "Title · Artist" (only while something is loaded)
            std::string line;
            if (active && !title[i]->state.empty()) {
              line = title[i]->state;
              if (!artist[i]->state.empty()) line += " · " + artist[i]->state;
            }
            lv_label_set_text(np[i], line.c_str());

            // Status: "Afspiller · 25 % · DR P3 · gruppe på 3"
            std::string status;
            if (s.empty()) status = "";
            else if (s == "playing") status = "Afspiller";
            else if (s == "paused") status = "Pause";
            else if (s == "idle") status = "Klar";
            else if (s == "off") status = "Slukket";
            else if (s == "buffering") status = "Indlæser";
            else if (!avail) status = "Ikke tilgængelig";
            else status = s;
            if (avail && !std::isnan(id(sonos_vol)[i]))
              status += " · " + std::to_string((int) lroundf(id(sonos_vol)[i] * 100.0f)) + " %";
            if (active && !channel[i]->state.empty()) status += " · " + channel[i]->state;
            int members = 0;
            const std::string &g = grp[i]->state;
            for (size_t p = g.find("media_player."); p != std::string::npos; p = g.find("media_player.", p + 1)) members++;
            if (avail && members > 1) status += " · gruppe på " + std::to_string(members);
            lv_label_set_text(stl[i], status.c_str());
          }

          // Are all available speakers in one group?
          int n_avail = 0;
          bool together = true;
          for (int i = 0; i < 4; i++) {
            if (!id(sonos_avail)[i]) continue;
            n_avail++;
            for (int j = 0; j < 4; j++)
              if (j != i && id(sonos_avail)[j] && grp[i]->state.find(id(sonos_ents)[j]) == std::string::npos) together = false;
          }
          if ((int32_t) (now - id(group_hold_until)) >= 0) id(all_grouped) = n_avail >= 2 && together;

          // Some of the screen still shows what a tap should do: read HA again
          // once that runs out, so a command that failed shows as it really is
          int32_t wait = (int32_t) (id(group_hold_until) - now);
          for (int i = 0; i < 4; i++) {
            wait = std::max(wait, (int32_t) (id(sonos_hold)[i] - now));
            wait = std::max(wait, (int32_t) (id(vol_hold)[i] - now));
          }
          if (wait > 0) id(sonos_settle).execute((int) wait);
      - script.execute: repaint_sonos
      - lambda: |-
          if (id(current_page) == 1) {
            id(ink_want) |= 1;
            id(ink_bg).execute();
          }

  # Draw the Sonos controls: ticks, play/pause (black + pause = playing,
  # white + play = not playing, no button = unavailable), volume and group button
  - id: repaint_sonos
    then:
      - lambda: |-
          lv_obj_t *btn[4] = {id(sn_btn0), id(sn_btn1), id(sn_btn2), id(sn_btn3)};
          lv_obj_t *ico[4] = {id(sn_ico0), id(sn_ico1), id(sn_ico2), id(sn_ico3)};
          lv_obj_t *chk[4] = {id(sn_chk0), id(sn_chk1), id(sn_chk2), id(sn_chk3)};
          lv_obj_t *mark[4] = {id(sn_mark0), id(sn_mark1), id(sn_mark2), id(sn_mark3)};
          float vol_sum = 0;
          int vol_n = 0;
          for (int i = 0; i < 4; i++) {
            const bool playing = id(sonos_playing)[i];
            const bool avail = id(sonos_avail)[i];
            const bool sel = (id(sonos_sel) >> i) & 1;
            // Unavailable (black/white only, no grey): no button, thin tick box
            lv_obj_set_style_bg_color(btn[i], lv_color_hex(playing ? 0x000000 : 0xFFFFFF), LV_PART_MAIN);
            lv_obj_set_style_border_width(btn[i], avail ? 2 : 0, LV_PART_MAIN);
            lv_obj_set_style_text_color(ico[i], lv_color_hex(playing ? 0xFFFFFF : 0x000000), LV_PART_MAIN);
            lv_label_set_text(ico[i], !avail ? "" : (playing ? "\U000F03E4" : "\U000F040A"));
            lv_obj_set_style_bg_color(chk[i], lv_color_hex(sel ? 0x000000 : 0xFFFFFF), LV_PART_MAIN);
            lv_obj_set_style_border_width(chk[i], avail ? 2 : 1, LV_PART_MAIN);
            lv_label_set_text(mark[i], sel ? "\U000F012C" : "");
            if (sel && avail && !std::isnan(id(sonos_vol)[i])) {
              vol_sum += id(sonos_vol)[i];
              vol_n++;
            }
          }
          if (vol_n > 0) {
            const std::string v = std::to_string((int) lroundf(vol_sum / vol_n * 100.0f)) + " %";
            lv_label_set_text(id(lbl_vol), v.c_str());
          } else {
            lv_label_set_text(id(lbl_vol), "--");
          }
          lv_label_set_text(id(cmb_icon), id(all_grouped) ? "\U000F033A" : "\U000F0339");
          lv_label_set_text(id(cmb_text), id(all_grouped) ? "Opdel alle zoner" : "Saml alle zoner");

  # ================================================================ header
  # Battery icon + percentage, top right
  - id: update_battery
    then:
      - lambda: |-
          static const char *const levels[11] = {
            "\U000F008E", "\U000F007A", "\U000F007B", "\U000F007C", "\U000F007D", "\U000F007E",
            "\U000F007F", "\U000F0080", "\U000F0081", "\U000F0082", "\U000F0079"};
          const float p = id(battery_level).state;
          const char *icon;
          if (id(charging).state) icon = "\U000F0084";
          else if (std::isnan(p)) icon = "\U000F008E";
          else icon = levels[std::max(0, std::min(10, (int) lroundf(p / 10.0f)))];
          lv_label_set_text(id(batt_icon), icon);
          char b[8];
          if (std::isnan(p)) snprintf(b, sizeof(b), "--%%");
          else snprintf(b, sizeof(b), "%d%%", (int) p);
          lv_label_set_text(id(batt_pct), b);
          id(ink_want) |= 1;
          id(ink_bg).execute();

  # A sensor value arrived: redraw the subtitles, at most every 2 minutes
  - id: subs_changed
    mode: single
    then:
      - delay: 2s
      - if:
          condition:
            lambda: "return !id(sleeping);"
          then:
            - script.execute: refresh_subs
      - delay: 120s

  # Rewrite the "21.8 °C · 47% · 443 ppm" lines and the header time
  - id: refresh_subs
    mode: restart
    then:
      - lambda: |-
          auto num = [](float v) -> std::string {
            if (std::isnan(v)) return "--";
            char b[16];
            snprintf(b, sizeof(b), "%.1f", v);
            std::string s(b);
            if (s.size() > 2 && s.compare(s.size() - 2, 2, ".0") == 0) s.resize(s.size() - 2);
            return s;
          };
          auto set = [](lv_obj_t *lbl, const std::string &s) {
            if (strcmp(lv_label_get_text(lbl), s.c_str()) != 0) lv_label_set_text(lbl, s.c_str());
          };
          lv_obj_t *sub[12] = {id(ar_sub0), id(ar_sub1), id(ar_sub2), id(ar_sub3), id(ar_sub4), id(ar_sub5),
                               id(ar_sub6), id(ar_sub7), id(ar_sub8), id(ar_sub9), id(ar_sub10), id(ar_sub11)};
          // Per area the sensors it has, in the order temperature, humidity, CO2
          static const char *const unit[3] = {" °C", "%", " ppm"};
          for (int a = 0; a < 12; a++) {
            std::string s;
            for (int k = 0; k < 3; k++) {
              if (!id(cfg_ents)[120 + a * 3 + k][0]) continue;
              if (!s.empty()) s += " · ";
              const float v = id(cfg_val)[a * 3 + k];
              if (k == 2 && !std::isnan(v)) {
                char b[16];
                snprintf(b, sizeof(b), "%.0f", v);
                s += b;
              } else {
                s += num(v);
              }
              s += unit[k];
            }
            set(sub[a], s);
          }
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            char hm[8];
            snprintf(hm, sizeof(hm), "%02d:%02d", now.hour, now.minute);
            id(last_update_hm) = hm;
            set(id(lbl_updated), std::string("Opdateret ") + hm);
          }
          id(ink_want) |= 1;
          id(ink_bg).execute();

# ---------------------------------------------------------------- fonts

# All fonts are 1 bpp (pure black/white, no grey edges) for the fast refresh
font:
  - id: font_title
    file: "gfonts://Atkinson+Hyperlegible@700"
    size: 28
    bpp: 1
    glyphs: &latin " !%()+,-./0123456789:?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÆØÅæøå°·"
  # Names and playlist titles: full Western European set
  - id: font_name
    file: "gfonts://Atkinson+Hyperlegible@700"
    size: 20
    bpp: 1
    glyphs: *latin
    glyphsets:
      - GF_Latin_Core
    ignore_missing_glyphs: true
  # Also used for song titles
  - id: font_sub
    file: "gfonts://Atkinson+Hyperlegible@400"
    size: 16
    bpp: 1
    glyphs: *latin
    glyphsets:
      - GF_Latin_Core
    ignore_missing_glyphs: true
  # Volume number and the -5 / -2 / +2 / +5 buttons
