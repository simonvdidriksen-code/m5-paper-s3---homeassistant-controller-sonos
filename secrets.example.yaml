# Copy to secrets.yaml (or add these keys to ESPHome Device Builder's Secrets)
# and fill in your own values. secrets.yaml is never committed.
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"
# 32 random bytes, base64. Generate one at https://esphome.io/components/api.html
# (or: python -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())")
api_encryption_key: "REPLACE-WITH-YOUR-OWN-BASE64-KEY="
